<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi entreno — Poli Malilla</title>
<style>
  :root{--ink:#14161B;--panel:#1E222B;--panel2:#262C37;--line:#333B47;--text:#EEF1F4;--muted:#98A1AE;
    --work:#FF4D5E;--sec:#96404B;--rest:#39414D;--good:#35C67A;--text2:#D3D9E0;--base:#2A303A;--line2:#4A5563;--star:#F5C542;
    --A:#FF4D5E;--B:#FF9F3C;--C:#8A6BFF;--D:#2FBFA0;--P:#2C9AD0;--G:#C98A5B;--R:#7AC74F;--W:#C2A57C;--X:#E86FB0;--Y:#D7E34A;--L:#6B7483;--r:14px;}
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--ink);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;padding:0 0 96px;line-height:1.4}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  header{position:sticky;top:0;z-index:20;background:var(--ink);padding:15px 0 0;border-bottom:1px solid var(--line)}
  .title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 11px}
  .title .cfg{margin-left:auto;align-self:center;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;font-size:17px;width:36px;height:34px;cursor:pointer;line-height:1}
  .cfg-ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
  .cfg-sh{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:16px 16px 26px;max-height:85vh;overflow:auto}
  .cfg-sh h3{margin:0 0 4px;font-size:17px} .cfg-sh p{margin:0 0 12px;color:var(--muted);font-size:12.5px}
  .cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cfg-opt{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;border:2px solid var(--line);cursor:pointer;text-align:left;font:inherit;font-weight:700;font-size:13.5px}
  .cfg-opt.on{border-color:var(--work)} .cfg-dots{display:flex;gap:5px} .cfg-dots i{width:18px;height:18px;border-radius:50%;display:block;border:1px solid rgba(127,127,127,.35)}
  .cfg-close{margin-top:14px;width:100%;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
  .title h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em} .title span{color:var(--muted);font-size:13px;font-weight:500}
  .nav{display:flex;gap:4px}
  .nav button{flex:1;min-height:42px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:14px;font-weight:700;cursor:pointer;padding:0 0 8px}
  .nav button.on{color:var(--text);border-bottom-color:var(--work)}
  .datebar{display:flex;align-items:center;gap:8px;margin:14px 0 2px}
  .datebar button{width:44px;min-height:44px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:18px;cursor:pointer}
  .datebar .dlabel{flex:1;text-align:center;font-size:14.5px;font-weight:700;text-transform:capitalize}
  .datebar .dlabel small{display:block;font-size:11px;font-weight:600;color:var(--good);text-transform:none}
  .tohoy{display:block;margin:8px auto 0;background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;min-height:34px;padding:0 14px;font-size:12.5px;font-weight:600;cursor:pointer}
  .subtabs{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 2px} .subtabs .tab{flex:1 0 calc(20% - 6px);min-width:0}
  .tab{flex:1;min-height:44px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s ease}
  .tab:active{transform:scale(.97)} .tab.on{color:#fff;border-color:transparent}
  .tab.on.a{background:var(--A)} .tab.on.b{background:var(--B)} .tab.on.c{background:var(--C)} .tab.on.d{background:var(--D);color:#062019} .tab.on.p{background:var(--P)} .tab.on.g{background:var(--G);color:#1a0f05} .tab.on.r{background:var(--R);color:#0f1a08} .tab.on.w{background:var(--W);color:#1a1206} .tab.on.x{background:var(--X);color:#1a0612} .tab.on.y{background:var(--Y);color:#1a1d05}
  .locsw{display:flex;gap:8px;margin:12px 0 4px} .locsw button{flex:1;min-height:42px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:11px;font-size:14px;font-weight:700;cursor:pointer} .locsw button.on{background:var(--panel2);color:var(--text);border-color:var(--X)}
  .absblk{margin:18px 2px 6px;font-size:13px;font-weight:800;color:var(--X)} .absblk span{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
  .sessname{font-size:14px;font-weight:700;margin:12px 2px 0}
  .sstats{display:flex;gap:8px;margin:10px 0 2px}
  .sf{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 8px 10px;text-align:center}
  .sf label{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:5px;line-height:1.2}
  .sf input{width:100%;min-height:42px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;font-size:16px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
  .sf input:focus{outline:2px solid var(--work);outline-offset:1px;border-color:var(--work)}
  .meta{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 4px}
  .meta .sub{font-size:13.5px;color:var(--muted)} .meta .prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums} .meta .prog b{color:var(--good)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:12px 2px 0;padding:9px 11px;background:var(--panel);border:1px solid var(--line);border-radius:11px}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
  details.proto{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin:10px 0 0;padding:0 12px}
  details.proto summary{cursor:pointer;min-height:42px;display:flex;align-items:center;font-size:13.5px;font-weight:700;list-style:none}
  details.proto summary::-webkit-details-marker{display:none}
  details.proto summary::after{content:'▾';margin-left:auto;color:var(--muted)}
  details.proto[open] summary::after{content:'▴'}
  .proto-body{font-size:12.8px;color:var(--text2);padding:0 0 12px;line-height:1.5}
  details.wu{border-color:#FF9F3C55} details.wu summary{color:#FFB25C} .wu ul{margin:4px 0 8px;padding-left:18px} .wu li{margin:3px 0} .wu p{margin:6px 0}
  .proto-body p{margin:0 0 8px} .proto-body b{color:var(--text)}
  .ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
  .ex.star{border-color:rgba(245,197,66,.45)}
  .ex.up{border-color:rgba(53,198,122,.6)}
  .ex.opt{border-style:dashed}
  .ex-top{display:flex;gap:12px}
  .fig-wrap{display:flex;flex-direction:column;align-items:center} .fig-cap{font-size:10px;color:var(--muted);font-weight:600;margin-top:2px} .figs{display:flex;gap:2px;flex:0 0 auto} .fig{width:50px;height:auto;display:block} .fig2{width:64px;height:auto;display:block}
  .demo-pair{display:flex;gap:8px;margin:10px 0 0}
  .demo-shot{display:block;flex:1;min-width:0;text-decoration:none}
  .demo-shot img{display:block;width:100%;height:150px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px}
  .demo-cap{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
  .ex-head .scheme{margin-top:2px}
  .ex-mus{display:flex;align-items:center;gap:12px;margin-top:10px}
  .ex-mus .badges{margin-top:0;flex:1;min-width:0}
  .status{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:14px 0 0;font-size:13px;line-height:1.5}
  .status .s1{font-size:15px} .status .s2{color:var(--muted);font-size:12.5px}
  .status .phase{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text2)}
  .status .phase .pref{color:var(--muted);font-weight:500}
  .status .alert{color:#FFC36B;font-size:12.5px;margin-top:6px}
  details.review{margin-top:8px;background:var(--panel2);border-radius:9px;padding:0 10px}
  details.review summary{cursor:pointer;min-height:38px;display:flex;align-items:center;font-weight:700;font-size:13px;color:#FFC36B}
  details.review ul{margin:0 0 6px;padding-left:18px;font-size:12.5px;color:var(--text2)} details.review li{margin:3px 0}
  details.review p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
  .finish{width:100%;min-height:52px;margin:18px 0 4px;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;background:var(--good);color:#0c1a12}

  .finish-sub{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 0}
  .finish-sub button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;cursor:pointer;padding:4px}
  .armsig{margin-top:8px;font-size:12.5px;color:var(--star)}
  .armnote{font-size:12.5px;color:var(--text2);margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
  .base{fill:var(--base)} .m{fill:var(--rest);transition:fill .15s ease}
  .ex-info{flex:1;min-width:0}
  .ex-name{font-size:16px;font-weight:700;margin:2px 0 4px;letter-spacing:-.01em}
  .target{font-size:13px;color:var(--text);background:rgba(53,198,122,.08);border:1px solid rgba(53,198,122,.3);border-radius:9px;padding:7px 10px;margin-top:8px;line-height:1.45}
  .target .why,.review-card .why{color:var(--muted);font-size:11.5px}
  .advice div{font-size:12.5px;color:#FFC36B;margin:6px 2px 0;line-height:1.4}
  .advice:empty{display:none}
  .scard{margin:12px 0} .scard-img svg{width:100%;height:auto;display:block;border-radius:16px;border:1px solid var(--line)}
  .scard-btns{display:flex;gap:8px;margin-top:8px} .scard-btns button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
  .scard-msg{font-size:12px;color:var(--muted);min-height:16px;margin-top:4px;text-align:center} .scard-msg.err{color:var(--work)}
  .tot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .tot-t{background:var(--panel2);border-radius:10px;padding:10px 6px;text-align:center;min-width:0}
  .tot-t b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.15} .tot-t b small{font-size:11px;color:var(--muted);font-weight:600} .tot-t span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.25}
  .tot-body{width:100%;max-width:340px;height:auto;display:block;margin:14px auto 4px} .tot-mus{font-size:12px;color:var(--muted);text-align:center;line-height:1.6} .tot-mus b{color:var(--text)}
  .dly-strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 0 8px;scrollbar-width:none} .dly-strip::-webkit-scrollbar{display:none}
  .dly-chip{flex:0 0 auto;scroll-snap-align:center;min-width:52px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:6px 6px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit}
  .dly-chip b{font-size:13px} .dly-cw{font-size:10px;color:var(--muted)} .dly-cd{display:flex;gap:2px;min-height:6px} .dly-cd i{width:6px;height:6px;border-radius:50%}
  .dly-chip.on{border-color:var(--work);background:color-mix(in srgb,var(--work) 14%,transparent)}
  .dly-nav{display:flex;align-items:center;gap:8px;margin:4px 0 8px} .dly-arr{flex:0 0 40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px;cursor:pointer} .dly-arr:disabled{opacity:.3}
  .dly-title{flex:1;text-align:center;line-height:1.3} .dly-title b{display:block;font-size:14px} .dly-title small{color:var(--muted);font-size:12px}
  .dly-body{min-height:60px} .dly-body .scard{margin:0 0 8px} .dly-line{font-size:13px;padding:7px 2px;border-top:1px solid var(--line)} .dly-note{font-size:12px;color:var(--muted);padding:8px 2px;border-top:1px solid var(--line);white-space:pre-wrap}
  .heat-leg{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted);margin:2px 0 10px;flex-wrap:wrap} .heat-leg i{width:16px;height:16px;border-radius:4px;display:inline-block} .heat-leg span{margin:0 2px} .heat-leg .hl-gap{width:10px}
  .away{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 2px 10px;padding:8px 11px;border:1px dashed var(--line);border-radius:10px;font-size:13px;color:var(--text);cursor:pointer} .away input{width:18px;height:18px;accent-color:var(--work)} .away small{color:var(--muted);font-size:11.5px;flex-basis:100%;margin-left:26px} .away.on{border-style:solid;border-color:var(--star);background:rgba(245,197,66,.08)}
  .stepsrow{display:flex;align-items:center;gap:10px;margin:6px 2px 8px;font-size:13px;color:var(--muted)} .stepsrow input{width:110px;min-height:36px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:15px;text-align:center;font-variant-numeric:tabular-nums} .stepsrow input:focus{outline:2px solid var(--W);border-color:var(--W)}
  .steps-bars{width:100%;height:auto;display:block;margin:12px 0 2px}
  .rs-stats div:last-child:nth-child(3n+1){grid-column:1/-1}
  .rs-wknav{margin-left:auto;display:flex;gap:6px} .rs-wknav button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:18px;line-height:1;cursor:pointer} .rs-wknav button:disabled{opacity:.3;cursor:default}
  .review-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
  .review-card h3{margin:0 0 8px;font-size:15px}

  .rc-ok{color:var(--good);font-weight:700;font-size:13px;margin-top:6px} .rc-fix{color:#FFC36B;font-weight:700;font-size:13px;margin-top:6px}
  .rc-note{font-size:11.5px;color:var(--muted);margin:4px 0 0}
  .pr-badge{display:inline-block;font-size:12px;font-weight:700;color:var(--star);background:rgba(245,197,66,.12);border:1px solid rgba(245,197,66,.35);padding:1px 8px;border-radius:7px;margin:2px 0 0 6px;font-variant-numeric:tabular-nums}
  .star-badge{display:inline-block;font-size:11px;font-weight:800;color:#2a2000;background:var(--star);padding:1px 7px;border-radius:6px;margin:0 0 5px}
  .up-badge{display:inline-block;font-size:11px;font-weight:700;color:#0c1a12;background:var(--good);padding:1px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
  .scheme{display:inline-block;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--work);background:color-mix(in srgb,var(--work) 12%,transparent);padding:2px 8px;border-radius:7px}
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .bdg{font-size:11.5px;padding:2px 7px;border-radius:6px;font-weight:600;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .bdg.p{color:#fff;background:color-mix(in srgb,var(--work) 90%,transparent);border-color:transparent} .bdg.s{color:#fff;background:var(--sec);border-color:transparent}
  .cue{font-size:13px;color:var(--muted);margin:11px 0 0;padding:9px 11px;background:var(--panel2);border-radius:9px;border-left:3px solid var(--line)}
  .cue.warn{border-left-color:var(--work);color:color-mix(in srgb,var(--work) 35%,var(--text))}
  .rec{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

  button.rtag{cursor:pointer;color:var(--text)} button.rtag:active{background:var(--line)}
  .rtag.demo{color:#7FB2FF;border-color:rgba(127,178,255,.35)}
  .sets{margin-top:12px}
  .set-head,.set{display:grid;gap:7px;align-items:center;grid-template-columns:32px 1fr 112px 48px}
  .set-head{font-size:11px;color:var(--muted);padding:0 2px 6px;font-weight:600}
  .set-head.reps,.set.reps{grid-template-columns:32px 1fr 48px}
  .set-head.time,.set.time{grid-template-columns:32px 1fr}
  .set{margin-bottom:8px}
  .set .n{min-height:44px;background:none;border:1px dashed transparent;border-radius:9px;color:var(--muted);font-size:13px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
  .set .n:active{background:var(--panel2)}
  .set.warm .n{border-color:var(--line);color:var(--star)}
  .set.warm input{opacity:.55}
  .set input{width:100%;min-height:44px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:16px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;padding:0}
  .set input:focus{outline:2px solid var(--work);outline-offset:1px;border-color:var(--work)} .set input.filled{border-color:var(--line2)}
  .set input.rir{color:var(--star)}
  .stp{display:flex;align-items:center;gap:4px}
  .stp button{flex:0 0 32px;min-height:44px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:20px;font-weight:700;cursor:pointer;line-height:1;padding:0}
  .stp button:active{background:var(--line)}

  .setctl button:active{background:var(--panel2)}
  .last{font-size:12.5px;color:var(--muted);margin:10px 0 0;padding-left:2px} .last b{color:var(--text);font-weight:600}
  .opt-head{margin:20px 2px 4px;padding:11px 12px;border:1px dashed var(--line);border-radius:11px;font-size:12.5px;color:var(--text2);line-height:1.5}
  .opt-head b{color:var(--text)}

  .hidden-sec h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
  .hidden-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;padding:5px 0}
  .hidden-row button{background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;min-height:34px;padding:0 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  .note-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
  .note-card label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
  .note-card textarea{width:100%;min-height:60px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;font-size:14px;padding:9px;resize:vertical;font-family:inherit}
  .note-card textarea:focus{outline:2px solid var(--work);outline-offset:1px;border-color:var(--work)}

  .hero-toca{margin-top:9px;font-size:12.5px;color:var(--muted)}
  .act-l{display:grid;gap:8px} .act-l button{display:flex;align-items:center;gap:12px;background:var(--panel2);border:2px solid transparent;color:var(--text);font:inherit;font-weight:700;font-size:15px;padding:9px;border-radius:14px;cursor:pointer;text-align:left}
  .act-l button.on{border-color:var(--work)}
  .act-e{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px}
  .mas-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px;margin:14px 0}
  .mas-l{display:grid;gap:2px} .mas-l button{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--text);font:inherit;text-align:left;padding:13px 8px;border-radius:12px;cursor:pointer}
  .mas-l button>svg:first-child{width:24px;height:24px;color:var(--work)} .mas-l span{flex:1;display:flex;flex-direction:column;gap:2px} .mas-l small{color:var(--muted);font-size:12px}

<body>
<div class="wrap">
  <header><div class="title"><h1>Mi entreno</h1><span>Poli Malilla · Torso/Pierna</span><button class="cfg" id="cfgBtn" aria-label="Ajustes de estilo" title="Estilo de colores">⚙</button></div><div class="nav" id="nav"></div></header>
  <div id="view"></div>
  <footer>Manda la tendencia de 3-6 sesiones, no un día suelto.<br>Entrena con cabeza y descansa: así se progresa.<br><span style="display:inline-block;margin-top:8px;font-size:11px;opacity:.85">Imágenes de ejercicios: Exercise data by <a href="https://repdb.co" target="_blank" rel="noopener" style="color:inherit">RepDB (repdb.co)</a></span></footer>
</div>
<div id="rest" class="rest hide"><div class="inner">
  <div class="rest-idle"><span>Descanso</span><button data-rest="90">90s</button><button data-rest="120">2 min</button><button data-rest="180">3 min</button></div>
  <div class="rest-run hide"><button id="restAdd">+15s</button><span id="restNum">1:00</span><button id="restStop">Parar</button></div>
</div></div>
<style id="muscle-css"></style>
<script>
const FRONT=`<svg class="fig" viewBox="0 0 80 170" aria-hidden="true">
<circle class="base" cx="40" cy="14" r="9"/><rect class="base" x="37" y="22" width="6" height="5"/>
<path class="m m-traps" d="M30 25 L40 23 L40 31 L28 31 Z"/><path class="m m-traps" d="M50 25 L40 23 L40 31 L52 31 Z"/>
<ellipse class="m m-delts" cx="22" cy="37" rx="9" ry="8"/><ellipse class="m m-delts" cx="58" cy="37" rx="9" ry="8"/>
<rect class="m m-chest" x="28" y="31" width="11" height="14" rx="4"/><rect class="m m-chest" x="41" y="31" width="11" height="14" rx="4"/>
<ellipse class="m m-biceps" cx="17" cy="55" rx="6" ry="12"/><ellipse class="m m-biceps" cx="63" cy="55" rx="6" ry="12"/>
<ellipse class="m m-forearms" cx="14" cy="80" rx="5" ry="13"/><ellipse class="m m-forearms" cx="66" cy="80" rx="5" ry="13"/>
<rect class="m m-abs" x="34" y="46" width="12" height="26" rx="4"/>
<rect class="m m-obliques" x="28" y="48" width="5" height="20" rx="2"/><rect class="m m-obliques" x="47" y="48" width="5" height="20" rx="2"/>
<rect class="m m-quads" x="30" y="74" width="9" height="34" rx="4"/><rect class="m m-quads" x="41" y="74" width="9" height="34" rx="4"/>
<rect class="m m-calves" x="31" y="116" width="8" height="30" rx="4"/><rect class="m m-calves" x="41" y="116" width="8" height="30" rx="4"/></svg>`;
const BACK=`<svg class="fig" viewBox="0 0 80 170" aria-hidden="true">
<circle class="base" cx="40" cy="14" r="9"/><rect class="base" x="37" y="22" width="6" height="5"/>
<path class="m m-traps" d="M30 24 L50 24 L46 34 L34 34 Z"/>
<ellipse class="m m-reardelts" cx="22" cy="37" rx="9" ry="8"/><ellipse class="m m-reardelts" cx="58" cy="37" rx="9" ry="8"/>
<ellipse class="m m-triceps" cx="17" cy="55" rx="6" ry="12"/><ellipse class="m m-triceps" cx="63" cy="55" rx="6" ry="12"/>
<ellipse class="m m-forearms" cx="14" cy="80" rx="5" ry="13"/><ellipse class="m m-forearms" cx="66" cy="80" rx="5" ry="13"/>
<rect class="m m-upperback" x="33" y="34" width="14" height="12" rx="3"/>
<path class="m m-lats" d="M28 46 L38 47 L36 64 L30 59 Z"/><path class="m m-lats" d="M52 46 L42 47 L44 64 L50 59 Z"/>
<rect class="m m-lowerback" x="35" y="60" width="10" height="12" rx="3"/>
<rect class="m m-glutes" x="30" y="74" width="9" height="14" rx="4"/><rect class="m m-glutes" x="41" y="74" width="9" height="14" rx="4"/>
<rect class="m m-hamstrings" x="30" y="90" width="9" height="26" rx="4"/><rect class="m m-hamstrings" x="41" y="90" width="9" height="26" rx="4"/>
<rect class="m m-calves" x="31" y="118" width="8" height="28" rx="4"/><rect class="m m-calves" x="41" y="118" width="8" height="28" rx="4"/></svg>`;
const FIGS=`<div class="figs"><div class="fig-wrap">${FRONT}<span class="fig-cap">Delante</span></div><div class="fig-wrap">${BACK}<span class="fig-cap">Detrás</span></div></div>`;
const KEYS=['adductors','traps','delts','chest','biceps','triceps','forearms','abs','obliques','lats','upperback','lowerback','glutes','quads','hamstrings','calves','reardelts'];
const LBL={adductors:'Aductores',traps:'Trapecio',delts:'Hombros',chest:'Pecho',biceps:'Bíceps',triceps:'Tríceps',forearms:'Antebrazo',abs:'Abdomen',obliques:'Oblicuos',lats:'Dorsal',upperback:'Espalda alta',lowerback:'Lumbar',glutes:'Glúteos',quads:'Cuádriceps',hamstrings:'Isquios',calves:'Gemelos',reardelts:'Hombro post.'};
(()=>{let c='';KEYS.forEach(k=>c+=`.ex[data-s~="${k}"] .m-${k}{fill:var(--sec)}`);KEYS.forEach(k=>c+=`.ex[data-p~="${k}"] .m-${k}{fill:var(--work)}`);document.getElementById('muscle-css').textContent=c;})();

/* ===== PLAN (los 'id' conservan el historial aunque cambie el día) ===== */
const LATRAISE={id:'latraise',name:'Elevaciones laterales',scheme:'3 × 12-20',rest:75,q:'elevaciones laterales con mancuernas',p:['delts'],s:['traps'],cue:'Sube hasta la altura del hombro y baja lento. Peso ligero, sin impulso.'};
const CABLECRUNCH={id:'wcrunch',name:'Crunch con peso (tumbado)',scheme:'3 × 10-15',rest:75,q:'crunch con disco en el pecho',p:['abs'],s:['obliques'],cue:'Tumbado boca arriba, rodillas flexionadas, disco o mancuerna abrazado sobre el pecho. Enrolla el tronco despegando los omóplatos del suelo, aprieta 1 s arriba y baja despacio. No tires del cuello ni subas de golpe. Apunta el peso del disco o mancuerna.'};
const DECLINE={id:'declinecrunch',name:'Crunch en banco declinado',scheme:'3 × 10-15',rest:75,q:'crunch en banco declinado',p:['abs'],s:['obliques'],cue:'Piernas sujetas en los rodillos, brazos cruzados sobre el pecho (o abrazando un disco). Sube ENROLLANDO la espalda, acercando las costillas a la cadera, y para antes de sentarte del todo: la zona lumbar se queda en el banco. Aprieta 1 s y baja despacio (2-3 s). Sin tirones ni tirar del cuello. Para progresar: primero más reps, luego más inclinación o un disco. Si lo haces sin peso, apunta 0.'};
const LEGRAISE={id:'legraise',name:'Elevación de piernas',scheme:'3 × 10-15',rest:75,type:'reps',q:'elevación de piernas abdominales',p:['abs'],s:['obliques'],cue:'Tumbado, manos bajo los glúteos o agarrado al banco. Sube las piernas y al final despega un poco la cadera del suelo enrollando la pelvis. Baja controlado sin que la lumbar se arquee. Sin balanceo.'};
const SIDEPLANK={id:'sideplank',name:'Plancha lateral',scheme:'2 × 20-45 s / lado',rest:60,type:'time',q:'plancha lateral técnica',p:['obliques'],s:['abs'],cue:'Apoyado en el antebrazo, cuerpo recto de lado y cadera arriba, sin dejar que caiga. Respira normal, sin aguantar el aire. Para cuando la cadera empiece a bajar, aunque no hayas llegado al tiempo. Apunta los segundos por lado. Cuando hagas 45 s en todas las series, pasa a una versión más difícil (pierna de arriba levantada o apoyado en la mano) y vuelve a empezar desde 20 s.'};
const PLANK={id:'plank',name:'Plancha frontal',scheme:'2 × 30-60 s',rest:60,type:'time',q:'plancha abdominal técnica correcta',p:['abs'],s:['obliques'],cue:'Antebrazos y puntas de los pies, cuerpo recto de cabeza a talones. Aprieta abdomen y glúteo; que la cadera no caiga ni suba. Respira normal, sin aguantar el aire. Para cuando la cadera empiece a caer, aunque no hayas llegado al tiempo. Cuando hagas 60 s en todas las series, pasa a una versión más difícil (pies juntos, codos más adelantados o un disco en la espalda) y vuelve a empezar desde 30 s.'};
const FACEPULL={id:'facepull',name:'Face pull',scheme:'2 × 12-20',rest:75,q:'face pull en polea',p:['reardelts'],s:['upperback','traps'],cue:'Polea a la altura de la cara, con cuerda. Tira hacia la cara abriendo los codos hacia fuera y hacia atrás, y aprieta la espalda alta 1 s. Peso ligero y controlado. Si vas justo de tiempo, puedes intercalarlo con las elevaciones laterales (una serie de cada, sin descanso entre ellas).'};
const SESSIONS={
 A:{name:'Torso 1 · pecho y espalda',items:[
   {id:'chestpress',star:1,name:'Press de pecho en máquina',scheme:'3-4 × 6-10',rest:150,q:'press de pecho en máquina',p:['chest'],s:['delts','triceps'],cue:'Baja controlando hasta notar el pecho y sube sin dar tirón.'},
   {id:'seatedrow',star:1,name:'Remo sentado en polea',scheme:'3 × 8-12',rest:150,q:'remo sentado en polea',p:['upperback','lats'],s:['biceps','reardelts','traps'],cue:'Tira hacia el abdomen, pecho fuera y junta los omóplatos. Sin balancear el tronco.'},
   {id:'incline',name:'Press inclinado con mancuernas',scheme:'3 × 8-12',rest:105,q:'press inclinado con mancuernas',p:['chest'],s:['delts','triceps'],cue:'Banco a 30-45°. Mismo peso en las series de trabajo; nada de saltos grandes entre series.'},
   {id:'pulldown',name:'Jalón al pecho',scheme:'3 × 8-12',rest:105,q:'jalón al pecho polea',p:['lats'],s:['biceps','upperback'],cue:'Lleva la barra al pecho apretando la espalda. No te eches muy hacia atrás.'},
   {id:'barbellcurl',name:'Curl con barra',scheme:'3 × 8-12',rest:105,q:'curl de bíceps con barra',p:['biceps'],s:['forearms'],cue:'Codos fijos a los lados, sin balancear. La barra corta pesa 9 kg: apunta barra + discos. Con discos de 1,25 los pesos van de 2,5 en 2,5 (9, 11,5, 14, 16,5…).'},
   {id:'pushdown',name:'Tríceps en polea (pushdown)',scheme:'3 × 10-15',rest:105,q:'extensión de tríceps en polea',p:['triceps'],s:[],cue:'Codos pegados al cuerpo, extiende del todo y controla la subida.'},
   LATRAISE, FACEPULL
 ]},
 B:{name:'Pierna 1 · cuádriceps',items:[
   {id:'squat',star:1,name:'Sentadilla con mancuernas',total:1,wlabel:'Total (kg)',scheme:'3-4 × 6-10',rest:150,q:'sentadilla con mancuernas',p:['quads','glutes'],s:['hamstrings','adductors'],cue:'Una mancuerna en cada mano (a los lados o sobre los hombros: elige una forma y repítela siempre). Pies al ancho de hombros, pecho arriba, baja hasta al menos paralelo y sube empujando con todo el pie. Apunta el peso TOTAL: la suma de las dos mancuernas (2 de 5 kg = 10 kg).'},
   {id:'rdl',star:1,name:'Peso muerto rumano (barra o mancuernas)',scheme:'3 × 6-10',rest:150,q:'peso muerto rumano',p:['hamstrings','glutes'],s:['lowerback','traps'],warn:1,cue:'Con barra o mancuernas, lo que tengas libre: apunta siempre el peso total. Con la barra corta (9 kg) los pesos van de 2,5 en 2,5 (19, 21,5, 24, 26,5…). Bisagra de cadera y espalda RECTA siempre. Baja pegando el peso a las piernas hasta notar el estiramiento.'},
   {id:'legext',name:'Extensión de cuádriceps',scheme:'2-3 × 10-15',rest:105,q:'extensión de cuádriceps máquina',p:['quads'],s:[],cue:'Sube extendiendo, aprieta arriba y baja controlado.'},
   {id:'legcurl',name:'Curl femoral',scheme:'2-3 × 10-15',rest:105,q:'curl femoral tumbado máquina',p:['hamstrings'],s:[],cue:'Lleva el talón al glúteo sin despegar la cadera y baja lento.'},
   {id:'adductor',name:'Aductores en máquina',scheme:'2 × 12-15',rest:75,q:'máquina de aductores técnica',p:['adductors'],s:[],cue:'Sentado con la espalda apoyada, almohadillas en la cara interna de las rodillas. Cierra las piernas, aprieta 1 s y abre despacio hasta notar el estiramiento, sin dejar que las placas choquen. Rango cómodo: no abras más de lo que controlas. Apunta el peso que marque la máquina.'},
   {id:'calf',name:'Gemelos',scheme:'3 × 12-20',rest:75,q:'elevación de gemelos de pie máquina',p:['calves'],s:[],cue:'Sube de puntillas al máximo, pausa arriba y baja notando el estiramiento.'},
   {id:'wristcurl',name:'Curl de muñeca con barra',scheme:'2 × 15-20',rest:60,q:'curl de muñeca con barra sentado',p:['forearms'],s:[],cue:'En superserie con el curl invertido: haz una serie de cada uno seguidas y luego descansa. Sentado, antebrazos apoyados en los muslos (o en el banco) con las palmas hacia arriba y las muñecas por fuera de las rodillas. Deja que la barra baje hasta las yemas de los dedos, ciérrala y sube flexionando solo la muñeca; el antebrazo no se mueve. Sin rebotes. Barra corta de 9 kg: para empezar, la barra sola. Si molesta el codo por dentro, para.'},
   {id:'reversecurl',name:'Curl invertido con barra',scheme:'2 × 12-15',rest:75,q:'curl invertido con barra agarre prono',p:['forearms'],s:['biceps'],cue:'Va justo después del curl de muñeca (superserie). De pie, agarre por encima (palmas hacia abajo) a la anchura de los hombros. Sube con los codos pegados y las muñecas rectas, sin que se doblen hacia abajo, y baja en 2 s. Moverás bastante menos que en el curl normal: es normal. Barra corta de 9 kg: para empezar, unos 11,5 kg (barra + 1,25 por lado).'},

 ]},
 C:{name:'Torso 2 · hombro y espalda vertical',items:[
   {id:'shoulderpress',star:1,name:'Press de hombro en máquina',scheme:'3-4 × 6-10',rest:150,q:'press militar en máquina',p:['delts'],s:['triceps','traps'],cue:'Sube sin encoger el cuello, hombros hacia abajo.'},
   {id:'neutralpulldown',star:1,name:'Jalón agarre neutro o estrecho',scheme:'3 × 8-12',rest:150,q:'jalón al pecho agarre neutro estrecho',p:['lats'],s:['biceps','upperback'],cue:'Palmas enfrentadas. Lleva el agarre al pecho bajando los codos pegados al cuerpo.'},
   {id:'row',name:'Remo con mancuerna a una mano',scheme:'3 × 8-12 / lado',rest:105,q:'remo con mancuerna a una mano en banco',p:['lats','upperback'],s:['biceps','traps'],cue:'Rodilla y mano en el banco, espalda recta. Codo hacia atrás, sin girar el tronco.'},
   {id:'dbfly',name:'Aperturas con mancuernas en banco',scheme:'3 × 10-15',rest:105,q:'aperturas con mancuernas en banco plano',p:['chest'],s:['delts'],cue:'Tumbado en banco plano, mancuernas arriba con las palmas enfrentadas. Codos ligeramente flexionados y fijos: abre en arco hasta notar el estiramiento del pecho (sin bajar más allá de la línea del hombro) y sube juntando las manos. Peso moderado. Apunta el peso de cada mancuerna.'},
   {id:'hammercurl',name:'Curl martillo',scheme:'3 × 10-15',rest:105,q:'curl martillo con mancuernas',p:['biceps'],s:['forearms'],cue:'Agarre neutro (pulgares arriba), sin balanceo.'},
   {id:'ohtriceps',name:'Tríceps sobre la cabeza (mancuerna o polea)',scheme:'3 × 10-15',rest:105,q:'extensión de tríceps sobre la cabeza',p:['triceps'],s:[],cue:'Con mancuerna (sujeta con las dos manos) o con polea y cuerda de espaldas a la máquina. Codos arriba y quietos; extiende del todo y deja que el tríceps se estire al bajar.'},
   LATRAISE,
   FACEPULL,
   {id:'shrug',name:'Encogimientos con mancuernas',scheme:'2 × 12-15',rest:75,q:'encogimientos de hombros con mancuernas',p:['traps'],s:['forearms'],cue:'De pie, una mancuerna en cada mano y brazos estirados. Sube los hombros hacia las orejas en línea recta, aprieta 1 s arriba y baja despacio hasta notar el estiramiento. Sin girar los hombros ni doblar los codos. Apunta el peso de cada mancuerna. Si el agarre falla antes que el trapecio, usa una toalla o guante, no correas por ahora.'},
 ]},
 D:{name:'Pierna 2 · glúteo e isquios',items:[
   {id:'deadhang',opt:1,pre:1,name:'Colgarse de la barra',scheme:'2 × 30-60 s',rest:60,type:'time',q:'colgarse de la barra dead hang activo pasivo',p:['forearms'],s:['lats','upperback'],cue:'Opcional, al EMPEZAR la D como calentamiento de hombros (en la D el agarre casi no trabaja). Nunca antes de la A o la C. Serie 1 PASIVA: cuélgate relajado, brazos estirados, deja que los hombros suban hacia las orejas y respira (estira y da movilidad). Serie 2 ACTIVA: mismo agarre, pero baja los hombros lejos de las orejas y llévalos un poco atrás, aprieta el abdomen; los brazos siguen estirados, no es una dominada. Apunta los segundos. Empieza con 30-45 s y sube hacia 60. Si duele el hombro o la espalda, para. Si lo que falla es el agarre y no el hombro, es normal: no hace falta llegar al fallo.'},
   {id:'hipthrust',star:1,name:'Hip thrust en máquina',scheme:'3-4 × 8-12',rest:150,q:'hip thrust en máquina técnica',p:['glutes'],s:['hamstrings'],cue:'En máquina (la misma del curl femoral). Ajusta el apoyo para que quede justo bajo los omóplatos y el rodillo o cinturón sobre la cadera. Pies al ancho de cadera, rodillas a 90° arriba. Empuja con los talones, sube hasta que cadera y tronco queden en línea, aprieta el glúteo 1 s y baja controlado. Barbilla hacia el pecho y sin arquear la lumbar al final. Apunta el peso que marque la máquina.'},
   {id:'legpress',star:1,name:'Prensa de piernas',base:75.7,wlabel:'Discos (kg)',scheme:'3 × 8-12',rest:150,q:'prensa de piernas técnica',p:['quads','glutes'],s:['hamstrings','adductors'],cue:'La máquina vacía ya pesa 75,7 kg (starting resistance): apunta SOLO los discos que cargues. Empuja con los talones. No bloquees de golpe las rodillas al estirar.'},
   {id:'lunge',name:'Zancadas',scheme:'2 × 8-12 / pierna',rest:105,q:'zancadas con mancuernas',p:['quads','glutes'],s:['hamstrings','adductors'],cue:'Paso largo, rodilla de atrás hacia el suelo, tronco recto.'},
   {id:'legcurl',name:'Curl femoral',scheme:'3 × 10-15',rest:105,q:'curl femoral tumbado máquina',p:['hamstrings'],s:[],cue:'Lleva el talón al glúteo sin despegar la cadera y baja lento.'},
   {id:'abductor',name:'Abductores en máquina',scheme:'2 × 12-15',rest:75,q:'máquina de abductores glúteo medio técnica',p:['glutes'],s:[],cue:'Sentado con la espalda apoyada, almohadillas por fuera de las rodillas. Abre las piernas empujando hacia fuera, aprieta 1 s y vuelve despacio sin dejar que las placas choquen. Trabaja la parte de arriba y de fuera del glúteo (glúteo medio). Si la máquina es la misma que la de aductores, solo hay que cambiar la posición de las almohadillas. Apunta el peso que marque la máquina.'},
   {id:'calf',name:'Gemelos',scheme:'3 × 12-20',rest:75,q:'elevación de gemelos de pie máquina',p:['calves'],s:[],cue:'Sube de puntillas al máximo, pausa arriba y baja notando el estiramiento.'},
   {id:'preachercurl',opt:1,name:'Curl en banco Scott',scheme:'2 × 10-12',rest:90,q:'curl en banco scott predicador técnica',p:['biceps'],s:['forearms'],cue:'Axilas pegadas al borde del cojín y la parte de atrás de los brazos bien apoyada. Sube sin despegar los codos y BAJA DESPACIO (2-3 s), sin estirar el codo de golpe ni dejar caer la barra abajo del todo. Moverás bastante menos que de pie: es normal. Mejor con barra Z si la hay; con la barra corta de 9 kg apunta barra + discos (para empezar, unos 11,5 kg). Si molesta el codo o la muñeca, para.'},
   {id:'pushdown',opt:1,name:'Tríceps en polea (pushdown)',scheme:'2 × 10-15',rest:90,q:'extensión de tríceps en polea',p:['triceps'],s:[],cue:'Codos pegados al cuerpo, extiende del todo.'},

 ]},
 POOL:{name:'Piscina',pool:true},
 PADEL:{name:'Pádel',cardio:true},
 RUN:{name:'Correr',cardio:true},
 WALK:{name:'Andar',cardio:true},
 ABS:{name:'Abdominales · al acabar',abs:true,items:[
   Object.assign({},DECLINE,{loc:'gym',cat:'crunch'}),
   {id:'polcrunch',loc:'gym',cat:'crunch',name:'Crunch en polea de rodillas',scheme:'3 × 10-15',rest:75,q:'crunch en polea de rodillas técnica',p:['abs'],s:['obliques'],cue:'De rodillas frente a la polea alta, cuerda sujeta junto a la cabeza. Enrolla el tronco llevando los codos hacia los muslos: la cadera no se mueve, solo se dobla la espalda. Sube despacio sin soltar la tensión. Apunta el peso de la polea.'},
   Object.assign({},CABLECRUNCH,{loc:'casa',cat:'crunch'}),
   {id:'hangknee',loc:'gym',cat:'elev',name:'Elevación de rodillas colgado',scheme:'3 × 8-15',rest:75,type:'reps',q:'elevación de rodillas colgado barra abdominales',p:['abs'],s:['obliques','forearms'],cue:'Colgado de la barra, o con los antebrazos apoyados en la estación de abdominales. Sube las rodillas al pecho y al final enrolla la pelvis hacia arriba. Sin balanceo: baja despacio y para antes de coger impulso. Si el agarre se cansa antes que el abdomen, usa la estación de antebrazos. Para progresar: piernas más estiradas.'},
   Object.assign({},LEGRAISE,{loc:'both',cat:'elev'}),

function migratePlan(){ /* plan antiguo Empuje/Tirón/Pierna (A/B/C) -> etiquetas de solo lectura */

function ensureRec(dt,sid,id){data.days[dt]=data.days[dt]||{};data.days[dt][sid]=data.days[dt][sid]||{};
  if(!data.days[dt][sid][id]){const it=EX[id]||{scheme:'3'};data.days[dt][sid][id]={sets:Array.from({length:defaultSets(it)},()=>({}))};}
  return data.days[dt][sid][id];}
function filled(rec){return !!(rec&&rec.sets&&rec.sets.some(s=>s.a||s.b));}
function workSets(rec){return (rec&&rec.sets?rec.sets:[]).filter(s=>!s.w&&(s.a||s.b));}
function workFilled(rec){return workSets(rec).length>0;}
function metaHasData(dt,sid){const mm=(data.days[dt]&&data.days[dt].meta&&data.days[dt].meta[sid])||{};return !!(mm.dur||mm.kcal||mm.hr);}
function getMeta(dt,sid){return (data.days[dt]&&data.days[dt].meta&&data.days[dt].meta[sid])||{};}
function setMeta(dt,sid,f,v){data.days[dt]=data.days[dt]||{};data.days[dt].meta=data.days[dt].meta||{};data.days[dt].meta[sid]=data.days[dt].meta[sid]||{};if(v)data.days[dt].meta[sid][f]=v;else delete data.days[dt].meta[sid][f];queueSave();}
function daySessions(dt){const d=data.days[dt]||{};const out=ALLS.filter(k=>(d[k]&&Object.values(d[k]).some(filled))||metaHasData(dt,k));
  if((d.POOL&&d.POOL.largos)||metaHasData(dt,'POOL'))out.push('POOL');
  ['PADEL','RUN','WALK'].forEach(k=>{const c=d[k];if((c&&Object.values(c).some(v=>v!==''&&v!=null))||metaHasData(dt,k))out.push(k);});return out;}
/* "Anterior" = la última vez que hiciste ESE ejercicio, en cualquier sesión del plan (A/B/C/D/Abs).
   Ej.: gemelos del B toma como referencia los del D si fueron más recientes.
   Solo si nunca se ha hecho en el plan nuevo se muestra, como referencia, el plan antiguo (PUSH/PULL/LEGS). */
const HIST_POOL=['A','B','C','D','ABS'];
/* Días en otro gimnasio: cuentan para el plan, el total y el muñeco, pero NO para pesos recomendados, memoria de fallos, récords ni gráficas */
function stepsOf(dt){const v=parseInt(String(((data.days[dt]||{}).steps)||'').replace(/\D/g,''),10);return isNaN(v)?null:v;}

function homeDays(){return Object.keys(data.days).filter(d=>!isAway(d));}
function prevRecord(sid,id,before){const ds=homeDays().filter(d=>d<before).sort().reverse();
  const ks=HIST_POOL.includes(sid)?[sid,...HIST_POOL.filter(k=>k!==sid)]:[sid];
  for(const d of ds){for(const k of ks){const r=((data.days[d]||{})[k]||{})[id];if(workFilled(r))return{date:d,rec:r,sid:k,other:k!==sid};}}
  for(const d of ds){for(const k of ['PUSH','PULL','LEGS']){const r=((data.days[d]||{})[k]||{})[id];if(workFilled(r))return{date:d,rec:r,sid:k,legacy:true};}}

function fmtSet(s,type,long,id){
  const rir=(s.r!==undefined&&s.r!=='')?(long?` (RIR ${s.r})`:` @${s.r}`):'';
  if(type==='time')return (s.a||'—')+'s';

function fmtWork(rec,type,long,id){return workSets(rec).map(s=>fmtSet(s,type,long,id)).join(long?', ':'  ·  ');}
function shiftDate(k,delta){const d=new Date(k+'T12:00');d.setDate(d.getDate()+delta);return dkey(d);}

function topRep(scheme,type){if(type==='time')return null;const seg=scheme.split('×')[1]||'';const nums=(seg.match(/\d+/g)||[]).map(Number);if(!nums.length)return null;return nums.length>1?nums[1]:nums[0];}

function heatLevel(v){return !v?0:v<2?1:v<4?2:v<6.5?3:4;}
/* Kilos: mancuernas apuntadas por unidad cuentan ×2; prensa suma la máquina; "/ lado" o "/ pierna" cuenta los dos lados */
const KG_MULT={shrug:2,incline:2,dbfly:2,hammercurl:2,latraise:2,row:2,lunge:2};
function sidesOf(it){return /\/\s*(lado|pierna)/.test(it.scheme)?2:1;}
/* todo lo registrado ese día en la sesión (aunque el ejercicio ya no esté en el plan) + abs del mismo día */
function cardItems(dt,sid){return dayItems(dt,[sid,'ABS']);}
function cardStats(dt,sid){return statsOf(cardItems(dt,sid));}
function statsOf(items){const mus={};let sets=0,reps=0,kg=0;
  items.forEach(({it,rec})=>{const type=it.type||'weight';const ws=workSets(rec);const n=ws.length;sets+=n;const sd=sidesOf(it);
    (it.p||[]).forEach(m=>mus[m]=(mus[m]||0)+n);(it.s||[]).forEach(m=>mus[m]=(mus[m]||0)+n*0.5);
    ws.forEach(s=>{if(type==='time')return;const r=parseInt(type==='weight'?s.b:s.a,10)||0;reps+=r*sd;
      if(type==='weight'){const w=numW(s.a);if(!isNaN(w))kg+=((w||0)*(KG_MULT[it.id]||1)+(it.base||0))*r*sd;}});});
  return{items,mus,sets,reps,kg:Math.round(kg)};}
function bestSet(rec,type){let b=null;workSets(rec).forEach(x=>{const a=numW(x.a),r=parseInt(x.b,10)||0;
  if(type==='weight'){if(isNaN(a)||!r)return;if(!b||a>b.a||(a===b.a&&r>b.b))b={a,b:r};}else{if(isNaN(a)||!a)return;if(!b||a>b.a)b={a};}});return b;}
function bestBefore(id,type,before){let b=null;homeDays().filter(d=>d<before).forEach(dt=>ALLS.forEach(k=>{const r=((data.days[dt]||{})[k]||{})[id];
  const x=bestSet(r,type);if(x&&(!b||x.a>b.a||(type==='weight'&&x.a===b.a&&x.b>b.b)))b=x;}));return b;}
function cardRecords(dt,items){const out=[];if(isAway(dt))return out;items.forEach(({it,rec})=>{const type=it.type||'weight';const now=bestSet(rec,type);const old=bestBefore(it.id,type,dt);
  if(!now||!old)return;if(now.a>old.a||(type==='weight'&&now.a===old.a&&now.b>old.b))out.push({it,now,type});});return out;}
function prevSameSession(dt,sid){return homeDays().filter(d=>d<dt&&sessionHasWork(d,sid)).sort().pop()||null;}
function fmtInt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function fmtDec(n){return String(Math.round(n*10)/10).replace('.',',');}
function shortEx(n){return n.replace(/\s*\(.*?\)/g,'').replace(/ en máquina$/,'').trim();}
function bodySVG(side,mus,x,y,h){const s=h/1448,ox=side==='B'?-724*s:0;const D=BMAP_D[side];let g=`<g transform="translate(${x+ox} ${y}) scale(${s})">`;
  g+=`<path d="${side==='F'?BMAP_D.OF:BMAP_D.OB}" fill="${TC.out}" stroke="${TC.skin}" stroke-width="${2/s}"/>`;
  Object.keys(D).forEach(slug=>{let fill;if(BODY_SKIN[slug])fill=slug==='hair'?TC.hair:TC.skin;
    else{const ks=(BODY_MAP[side][slug])||[];const v=Math.max(0,...ks.map(k=>mus[k]||0));fill=HEAT[heatLevel(v)];}
    D[slug].forEach(d=>g+=`<path d="${d}" fill="${fill}"/>`);});
  return g+'</g>';}
function sessionCardSVG(dt,sid){const st=cardStats(dt,sid);const mm=getMeta(dt,sid);const n=sessNumber(dt,sid);
  const S=SESSIONS[sid];const [t1,t2]=S.name.split(' · ');
  const fecha=new Date(dt+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  const F='font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"';
  let v='';
  v+=`<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${TC.panel}"/><stop offset="1" stop-color="${TC.ink}"/></linearGradient></defs>`;
  v+=`<rect width="1080" height="__H__" fill="url(#cg)"/><rect x="0" y="0" width="1080" height="10" fill="${TC.work}"/>`;
  v+=`<text x="64" y="92" fill="${TC.muted}" font-size="28" font-weight="700" letter-spacing="3">MI ENTRENO${n?` · SESIÓN ${n}`:''}</text>`;
  v+=`<text x="64" y="160" fill="${TC.text}" font-size="60" font-weight="800">${esc(t1)}</text>`;
  v+=`<text x="64" y="208" fill="${TC.muted}" font-size="32">${esc(cap(t2||''))} · ${esc(fecha)}${isAway(dt)?' · otro gimnasio':''}</text>`;
  /* cuerpos */
  const bh=600,by=240;v+=bodySVG('F',st.mus,190,by,bh);v+=bodySVG('B',st.mus,570,by,bh);
  v+=`<text x="350" y="${by+bh+34}" fill="${TC.muted}" font-size="24" text-anchor="middle">Delante</text><text x="730" y="${by+bh+34}" fill="${TC.muted}" font-size="24" text-anchor="middle">Detrás</text>`;
  /* leyenda */
  const lx=920;v+=`<text x="${lx+40}" y="300" fill="${TC.muted}" font-size="20" text-anchor="middle">más</text>`;
  [4,3,2,1].forEach((l,i)=>v+=`<rect x="${lx+22}" y="${315+i*44}" width="36" height="36" rx="8" fill="${HEAT[l]}"/>`);
  v+=`<text x="${lx+40}" y="${315+4*44+22}" fill="${TC.muted}" font-size="20" text-anchor="middle">series</text>`;
  /* músculos */
  const top=Object.entries(st.mus).filter(([,x])=>x>=1).sort((a,b)=>b[1]-a[1]).slice(0,6);
  let my=by+bh+86;const chips=top.map(([k,x])=>`${LBL[k]||k} ${fmtDec(x)}`);
  [chips.slice(0,3),chips.slice(3,6)].forEach((row,i)=>{if(row.length)v+=`<text x="540" y="${my+i*40}" fill="${TC.text}" font-size="28" text-anchor="middle">${esc(row.join('   ·   '))}</text>`;});
  /* números */
  const ty=my+(chips.length>3?66:26);const tiles=[['SERIES',fmtInt(st.sets)],['REPETICIONES',fmtInt(st.reps)],['KG MOVIDOS',fmtInt(st.kg)],(mm.dur?['MINUTOS',String(mm.dur)]:mm.hr?['PPM MEDIA',String(mm.hr)]:['EJERCICIOS',String(st.items.length)])];
  tiles.forEach(([l,val],i)=>{const x=64+i*244;v+=`<rect x="${x}" y="${ty}" width="220" height="132" rx="20" fill="${TC.panel2}"/><text x="${x+110}" y="${ty+74}" fill="${TC.text}" font-size="50" font-weight="800" text-anchor="middle">${esc(val)}</text><text x="${x+110}" y="${ty+112}" fill="${TC.muted}" font-size="20" font-weight="700" letter-spacing="1.5" text-anchor="middle">${l}</text>`;});
  let ly=ty+132+50;const extra=[];if(mm.dur&&mm.hr)extra.push(`${mm.hr} ppm de media`);if(mm.kcal)extra.push(`${mm.kcal} kcal`);
  const pd=isAway(dt)?null:prevSameSession(dt,sid);if(pd){const ps=cardStats(pd,sid);if(ps.kg){const d=st.kg-ps.kg;const pc=Math.round(d/ps.kg*100);
    extra.push(`${d>=0?'+':'−'}${fmtInt(Math.abs(d))} kg (${d>=0?'+':'−'}${Math.abs(pc)} %) vs la última ${sid} (${new Date(pd+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'numeric'})})`);}}
  if(extra.length){v+=`<text x="540" y="${ly}" fill="${TC.muted}" font-size="26" text-anchor="middle">${esc(extra.join('  ·  '))}</text>`;ly+=52;}
  /* récords */
  const rec=cardRecords(dt,st.items);
  rec.slice(0,3).forEach((r,i)=>{const val=r.type==='weight'?`${fmtDec(r.now.a)} kg × ${r.now.b}`:r.type==='time'?`${r.now.a} s`:`${r.now.a} reps`;
    v+=`<text x="540" y="${ly+i*46}" fill="#F5C542" font-size="30" font-weight="700" text-anchor="middle">★ Récord · ${esc(shortEx(r.it.name))} ${esc(val)}</text>`;});
  if(rec.length>3)v+=`<text x="540" y="${ly+3*46}" fill="#F5C542" font-size="24" text-anchor="middle">y ${rec.length-3} récord${rec.length-3>1?'s':''} más</text>`;
  const H=Math.max(1350,Math.ceil(ly+Math.min(rec.length,4)*46+20));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 ${H}" width="1080" height="${H}" ${F}>`+v.replace('__H__',H)+'</svg>';}
function sessionCardHTML(dt,sid){return `<div class="scard"><div class="scard-img">${sessionCardSVG(dt,sid)}</div>

/* ===== RESUMEN: total desde el principio y día a día ===== */
const STR_KEYS=['A','B','C','D','PUSH','PULL','LEGS'];
function itemFor(k,id){return ((SESSIONS[k]&&SESSIONS[k].items)||[]).find(x=>x.id===id)||EX[id]||{id,name:id,scheme:'3',p:[],s:[]};}
function dayItems(dt,keys){const d=data.days[dt]||{};const out=[];(keys||[...STR_KEYS,'ABS']).forEach(k=>{const s=d[k];if(!s||typeof s!=='object')return;
  Object.keys(s).forEach(id=>{const rec=s[id];if(workFilled(rec))out.push({k,it:itemFor(k,id),rec});});});return out;}
function cardioLines(dt){const d=data.days[dt]||{};const L=[];
  RS_ACT.forEach(a=>{if(!daySessions(dt).includes(a.k))return;const mm=getMeta(dt,a.k)||{};const v=rsNum(a.get(d));const p=[];
    if(v!==null)p.push(a.k==='PADEL'?`${rsFmt(v)} ${v==1?'partido':'partidos'}`:`${rsFmt(v)} ${a.u}`);
    if(mm.dur)p.push(`${mm.dur} min`);const lw=rsNum((d[a.k]||{}).lastre);if(lw)p.push(`lastre ${rsFmt(lw)} kg`);
    L.push({k:a.k,icon:a.icon,name:a.name,txt:p.join(' · ')||'registrado'});});
  const g=dayItems(dt,['GRIP']);if(g.length){const n=g.reduce((t,x)=>t+workSets(x.rec).length,0);L.push({k:'GRIP',icon:'✊',name:'Gripper',txt:`${n} series`});}
  return L;}
function totalsData(){const days=Object.keys(data.days).sort().filter(dt=>daySessions(dt).length);
  const all=[];let strength=0,mins=0,prs=0;const best={};
  days.forEach(dt=>{const its=dayItems(dt);all.push(...its);strength+=STR_KEYS.filter(k=>sessionHasWork(dt,k)).length;
    Object.values((data.days[dt]||{}).meta||{}).forEach(mm=>mins+=parseInt(mm.dur,10)||0);
    if(!isAway(dt))its.forEach(({it,rec})=>{const type=it.type||'weight';const now=bestSet(rec,type);if(!now)return;const o=best[it.id];
      if(o&&(now.a>o.a||(type==='weight'&&now.a===o.a&&now.b>o.b)))prs++;
      if(!o||now.a>o.a||(type==='weight'&&now.a===o.a&&now.b>o.b))best[it.id]=now;});});
  const cardio=RS_ACT.map(a=>{const E=rsActExpo(a);return{a,n:E.length,main:E.reduce((t,e)=>t+(e.main||0),0)};}).filter(x=>x.n);
  return{days,first:days[0],strength,mins,prs,cardio,st:statsOf(all)};}

/* Pasos: media semanal (solo días apuntados) y barras de los últimos 28 días */
function rsStepsHTML(){const t=todayKey();const monday=rsAdd(t,-((new Date(t+'T12:00').getDay()+6)%7));
  const avg=(from,to)=>{const v=[];for(let dt=from;dt<=to;dt=rsAdd(dt,1)){const s=stepsOf(dt);if(s)v.push(s);}return v.length?{m:Math.round(v.reduce((a,b)=>a+b,0)/v.length),n:v.length}:null;};
  const cur=avg(monday,t),prev=avg(rsAdd(monday,-7),rsAdd(monday,-1));
  const days=[];for(let i=27;i>=0;i--)days.push(rsAdd(t,-i));const vals=days.map(stepsOf);
  if(!vals.some(v=>v)&&!cur&&!prev)return `<div class="rs-card"><h3>👟 Pasos</h3><div class="rs-hint" style="margin:0">Apunta los pasos del reloj arriba en Entreno ("👟 Pasos del día") y aquí verás tu media semanal.</div></div>`;
  const mx=Math.max(1,...vals.map(v=>v||0));const W=280,H=70,bw=W/28;
  let bars='';vals.forEach((v,i)=>{if(!v)return;const h=Math.max(2,v/mx*(H-4));const wk=days[i]>=monday;bars+=`<rect x="${(i*bw+1).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${wk?'var(--W)':'var(--line)'}"><title>${rsDD(days[i])}: ${fmtInt(v)} pasos</title></rect>`;});
  const tr=cur&&prev?(cur.m>prev.m*1.05?'<span class="rs-tr rs-up">↑</span>':cur.m<prev.m*0.95?'<span class="rs-tr rs-dn">↓</span>':'<span class="rs-tr rs-fl">→</span>'):'';
  return `<div class="rs-card"><h3>👟 Pasos <span class="rs-subt">del reloj · orientativo</span></h3>
   <div class="tot-grid" style="grid-template-columns:1fr 1fr"><div class="tot-t"><b>${cur?fmtInt(cur.m):'—'} ${tr}</b><span>media esta semana${cur?` (${cur.n} ${cur.n==1?'día':'días'})`:''}</span></div><div class="tot-t"><b>${prev?fmtInt(prev.m):'—'}</b><span>media semana pasada</span></div></div>
   <svg viewBox="0 0 ${W} ${H}" class="steps-bars" role="img" aria-label="Pasos de los últimos 28 días">${bars}</svg>
   <div class="rs-hint">Últimos 28 días; en color, esta semana. Los días de gimnasio el reloj suele sumar algún paso de más por el movimiento de los brazos.</div></div>`;}
function rsTotalsHTML(){const T=totalsData();if(!T.days.length)return'';const st=T.st;
  const since=new Date(T.first+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'long'});const span=daysBetween(T.first,todayKey())+1;
  const tiles=[[T.days.length,'días entrenados'],[T.strength,'sesiones de fuerza'],[fmtInt(st.sets),'series'],[fmtInt(st.reps),'repeticiones'],[fmtInt(st.kg),'kg movidos'],[T.prs,'récords batidos']];
  if(T.mins)tiles.push([fmtInt(T.mins),'minutos apuntados']);
  T.cardio.forEach(c=>{const u=c.a.k==='PADEL'?(c.main==1?'partido':'partidos'):c.a.u;tiles.push([c.main?`${rsFmt(Math.round(c.main*10)/10)} <small>${u}</small>`:c.n,`${c.a.icon} ${c.a.name} · ${c.n} ${c.n==1?'día':'días'}`]);});
  const mx=Math.max(1,...Object.values(st.mus));const rel={};Object.entries(st.mus).forEach(([k,v])=>{const r=v/mx;rel[k]=r>=0.85?7:r>=0.6?5:r>=0.35?3:1;});
  const top=Object.entries(st.mus).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span style="white-space:nowrap">${LBL[k]||k} <b>${fmtDec(v)}</b></span>`).join(' · ');
  const body=`<svg viewBox="0 0 760 720" class="tot-body" role="img" aria-label="Músculos trabajados desde el principio">${bodySVG('F',rel,20,0,660)}${bodySVG('B',rel,410,0,660)}<text x="185" y="705" fill="${TC.muted}" font-size="26" text-anchor="middle" font-family="system-ui,sans-serif">Delante</text><text x="575" y="705" fill="${TC.muted}" font-size="26" text-anchor="middle" font-family="system-ui,sans-serif">Detrás</text></svg>`;

function renderCalendar(){

  let h=`<div class="cal-head"><button data-mv="-1" aria-label="Mes anterior">‹</button><div class="mon">${monName}</div><button data-mv="1" aria-label="Mes siguiente">›</button></div>`;
  h+=`<div class="cal-grid">`+['L','M','X','J','V','S','D'].map(d=>`<div class="cal-wd">${d}</div>`).join('');
  for(let i=0;i<start;i++)h+=`<div class="cal-cell empty"></div>`;
  const tk=todayKey();
  for(let d=1;d<=days;d++){const key=`${y}-${pad(m+1)}-${pad(d)}`;const sess=daySessions(key);const dots=sess.map(s=>`<i style="background:${SCOL[s]}"></i>`).join('');

  h+=`</div>`;

  viewEl.innerHTML=h;
  viewEl.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{calMonth=new Date(y,m+parseInt(b.dataset.mv,10),1);renderCalendar();});
  viewEl.querySelectorAll('[data-day]').forEach(c=>c.onclick=()=>{selDay=(selDay===c.dataset.day?null:c.dataset.day);renderCalendar();});

function dayPreview(dt){

    const s=d[sid]||{};const mm=getMeta(dt,sid);const mb=[];if(mm.dur)mb.push(`${esc(mm.dur)} min`);if(mm.kcal)mb.push(`${esc(mm.kcal)} kcal`);if(mm.hr)mb.push(`${esc(mm.hr)} ppm`);
    const sn=PLAN.includes(sid)?sessNumber(dt,sid):null;
    inner+=`<div class="cp-sess" style="color:${SCOL[sid]}">${sessName(sid)}${sn?' · sesión '+sn:(PLAN.includes(sid)?' · sin finalizar':'')}${mb.length?` · ${mb.join(' · ')}`:''}</div>`;
    Object.keys(s).forEach(id=>{const r=s[id];if(!workFilled(r))return;const def=EX[id]||{name:id};inner+=`<div class="cp-ex"><span>${def.name}</span><span>${esc(fmtWork(r,def.type||'weight',false,id))}</span></div>`;});
  });

  const step=d=>rsSelect(L[(i+d+L.length)%L.length]);
  document.getElementById('rsPv').onclick=()=>step(-1);document.getElementById('rsNx').onclick=()=>step(1);
  let x0=null;const n3=document.getElementById('rsNav3');n3.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
  n3.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40)step(dx<0?1:-1);});}
function rsSelect(v){rsChartSel=v;rsDrawPicker();rsDrawChart(v);}
function rsDrawChart(v){rsChartSel=v;const box=document.getElementById('rsChart');if(!box)return;let html;
  if(v.startsWith('act:')){const a=RS_ACT.find(x=>x.k===v.slice(4));const E=rsActExpo(a);html=E.length?rsActCombo(a,E):'<div class="rs-hint" style="padding:10px 0">Aún no lo has registrado.</div>';}
  else{const it=rsItemById(v);const E=rsExpo(v,it.type||'weight');const rg=rangeOf(it);
    html=`<div class="rs-cap">${E.length} ${E.length===1?'vez':'veces'}${rg?` · rango ${rg.lo}-${rg.hi} ${it.type==='time'?'s':'reps'}`:''}</div>`+(E.length?rsCombo(it,E):'<div class="rs-hint" style="padding:10px 0">Aún no lo has registrado.</div>');}
  box.innerHTML=html;const s=box.querySelector('.rs-scr');if(s)s.scrollLeft=s.scrollWidth;
  box.querySelectorAll('.rs-bar').forEach(r=>r.addEventListener('click',()=>{box.querySelectorAll('.rs-chip.on').forEach(c=>c.classList.remove('on'));const c=box.querySelector(`.rs-chip[data-c="${r.dataset.c}"]`);if(c)c.classList.add('on');}));}
function rsBindCharts(){if(!document.getElementById('rsCharts'))return;if(!rsChartSel)rsChartSel=rsDefaultChart();rsSelect(rsChartSel);
  viewEl.querySelectorAll('.rs-go').forEach(r=>r.onclick=()=>{rsSelect(r.dataset.go);document.getElementById('rsCharts').scrollIntoView({behavior:'smooth',block:'start'});});}
function renderResumen(){
  const now=new Date();const ws=new Date(now);ws.setDate(now.getDate()-((now.getDay()+6)%7));ws.setHours(0,0,0,0);
  const mk=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  let weekDays=0,monthStr=0,monthPool=0,monthExtra=0,monthMin=0,monthKcal=0;const STR=['A','B','C','D','PUSH','PULL','LEGS'];
  Object.keys(data.days).forEach(dt=>{const sess=daySessions(dt);if(dt.startsWith(mk))sess.forEach(k=>{if(STR.includes(k))monthStr++;else if(k==='POOL')monthPool++;else monthExtra++;});
    const d=new Date(dt+'T12:00');if(d>=ws&&d<=now&&sess.length)weekDays++;
    if(dt.startsWith(mk)){const mt=(data.days[dt].meta)||{};Object.values(mt).forEach(mm=>{monthMin+=parseInt(mm.dur,10)||0;monthKcal+=parseInt(mm.kcal,10)||0;});}});
  const t0=todayKey(),mon0=rsAdd(t0,-((new Date(t0+'T12:00').getDay()+6)%7));const sw=[];for(let dt=mon0;dt<=t0;dt=rsAdd(dt,1)){const v=stepsOf(dt);if(v)sw.push(v);}
  const stats=[[weekDays,'días esta semana'],[monthStr,'fuerza este mes'],[monthPool,'piscina este mes'],[monthExtra,'abs, pádel, agarre y cardio este mes'],[monthMin,'min este mes'],[monthKcal,'kcal este mes'],[sw.length?fmtInt(Math.round(sw.reduce((a,b)=>a+b,0)/sw.length)):'—','👟 pasos/día de media esta semana']];
  let h=rsPlanHTML(stats)+rsWeekHTML()+rsStepsHTML()+rsTotalsHTML()+rsDailyHTML()+`<div class="rs-h2">Ejercicios</div><div class="rs-hint" style="margin:4px 2px 0">Toca un ejercicio para verlo en la sección 📈 Gráficas, abajo del todo.</div>`+rsSessionsHTML()+rsCardioHTML()+rsMusclesHTML()+rsChartsHTML();
  h+=`<div class="backup"><h3>Exportar para compartir</h3>
    <p>Texto legible con todos tus días (solo series de trabajo con su RIR, tiempo, calorías y pulsaciones) para pasárselo a alguien.</p>
    <textarea id="txtBox" readonly>${esc(buildReport())}</textarea>
    <div class="bbtns"><button id="txtCopy">Copiar texto</button><button id="txtDl">Descargar .txt</button></div>
    <div class="bmsg" id="txtmsg"></div></div>`;
  h+=`<div class="backup"><h3>Copia de seguridad</h3>
    <p>Guarda este texto en sitio seguro (notas, email…). Restáuralo aquí si cambias de móvil o se pierden los datos.</p>
    <textarea id="expBox" readonly>${esc(JSON.stringify(data))}</textarea>
    <div class="bbtns"><button id="copyBtn">Copiar</button><button id="dlBtn">Descargar</button></div>
    <p>Pega aquí una copia para restaurar:</p><textarea id="impBox" placeholder='{"days":...}'></textarea>
    <div class="bbtns"><button id="impBtn">Restaurar copia</button></div><div class="bmsg" id="bmsg"></div></div>`;
  viewEl.innerHTML=h;rsBindCharts();rsBindDaily();rsBindMus();
  const copyFrom=async(id,cb)=>{const t=document.getElementById(id);try{await navigator.clipboard.writeText(t.value);cb('Copiado ✓');}catch(e){t.select();try{document.execCommand('copy');cb('Copiado ✓');}catch(_){cb('No se pudo copiar',1);}}};
  const dlFrom=(id,name,type,cb)=>{try{const b=new Blob([document.getElementById(id).value],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);cb('Descargando ✓');}catch(e){cb('No se pudo; usa Copiar',1);}};
  document.getElementById('txtCopy').onclick=()=>copyFrom('txtBox',tmsg);
  document.getElementById('txtDl').onclick=()=>dlFrom('txtBox','mi-entreno.txt','text/plain',tmsg);
  document.getElementById('copyBtn').onclick=()=>copyFrom('expBox',msg);
  document.getElementById('dlBtn').onclick=()=>dlFrom('expBox','mi-entreno-backup.json','application/json',msg);
  document.getElementById('impBtn').onclick=()=>{const v=document.getElementById('impBox').value.trim();if(!v){msg('Pega una copia primero',1);return;}
    try{const o=JSON.parse(v);if(!o.days)throw 0;data=o;normalize();migratePlan();migrateIds();raw.set(K3,JSON.stringify(data));msg('Datos restaurados ✓');setTimeout(()=>renderResumen(),600);}catch(e){msg('Copia no válida',1);}};
}
function msg(t,err){const m=document.getElementById('bmsg');if(!m)return;m.textContent=t;m.className='bmsg'+(err?' err':'');}
function tmsg(t,err){const m=document.getElementById('txtmsg');if(!m)return;m.textContent=t;m.className='bmsg'+(err?' err':'');}

/* ===== TEMPORIZADOR ===== */
let rInt=null,rLeft=0;
function fmtT(s){return Math.floor(s/60)+':'+pad(Math.max(0,s%60));}
function restShow(run){document.querySelector('#rest .rest-idle').classList.toggle('hide',run);document.querySelector('#rest .rest-run').classList.toggle('hide',!run);}
function updRestNum(){const n=document.getElementById('restNum');if(n)n.textContent=fmtT(rLeft);}
function startRest(sec){if(rInt)clearInterval(rInt);rLeft=sec;restShow(true);updRestNum();rInt=setInterval(()=>{rLeft--;if(rLeft<=0)finishRest();else updRestNum();},1000);}
function stopRest(){if(rInt){clearInterval(rInt);rInt=null;}restShow(false);}
function beep(){try{const Ctx=window.AudioContext||window.webkitAudioContext;const c=new Ctx();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;o.start();g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.4);o.stop(c.currentTime+.42);}catch(e){}}
function finishRest(){if(rInt){clearInterval(rInt);rInt=null;}beep();try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}const n=document.getElementById('restNum');if(n)n.textContent='¡Ya!';setTimeout(()=>restShow(false),1500);}
function updateRestBar(){const r=document.getElementById('rest');if(!r)return;r.classList.toggle('hide',!((view==='entreno'&&current!=='POOL'&&!CARDIO[current])||view==='post'));}
document.querySelectorAll('#rest [data-rest]').forEach(b=>b.onclick=()=>startRest(parseInt(b.dataset.rest,10)));
document.getElementById('restStop').onclick=()=>stopRest();
document.getElementById('restAdd').onclick=()=>{rLeft+=15;updRestNum();};

document.getElementById('cfgBtn').onclick=openSettings;
(async()=>{loadTheme();await loadData();const st=planStatus();current=st.today.length?st.today[st.today.length-1].sid:(st.inProg.length?st.inProg[0]:st.next);render();})();
</script>
