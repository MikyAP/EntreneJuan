<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Entreno</title>
<style>
:root{
  --bg:#f4f3ef; --card:#ffffff; --card2:#f0eee8; --ink:#1b1d21; --muted:#6b6f78; --line:#e2dfd7;
  --acc:#e4572e; --acc-ink:#ffffff; --acc-soft:#fde5dc; --ok:#2f9e5f; --ok-soft:#dcf2e5;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121417; --card:#1c1f24; --card2:#24282e; --ink:#eef0f3; --muted:#9aa1ab; --line:#2d3239;
    --acc:#ff6a3d; --acc-ink:#1a0d07; --acc-soft:#3a2219; --ok:#4cc382; --ok-soft:#173326;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--acc)}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand span{color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--muted)}
.pill b{color:var(--ink)}
h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--card2);font-weight:600;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:#d23b3b}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1}

/* Inicio */
.hero{display:flex;gap:14px;align-items:center}
.big-letter{width:64px;height:64px;border-radius:18px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-size:34px;font-weight:800;flex:none}
.hero h3{margin:0;font-size:18px}
.plan-list{margin:12px 0 4px;padding:0;list-style:none}
.plan-list li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.plan-list li:first-child{border-top:0}
.plan-list .sr{color:var(--muted);white-space:nowrap}
.plan-list .sw{color:var(--acc);font-size:12px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:999px;background:var(--card2);font-weight:600;font-size:14px}
.chip.on{background:var(--acc);color:var(--acc-ink)}

/* Sesión */
.sess-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.sess-head h3{margin:0;font-size:18px}
.note{background:var(--acc-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.ex .top{display:flex;gap:12px}
.thumbs{display:flex;gap:4px;flex:none}
.thumb{width:62px;height:62px;border-radius:10px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;padding:0;flex:none}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb.none{background:var(--card2);font-size:22px;color:var(--muted)}
.ex h4{margin:0 0 2px;font-size:16px;line-height:1.25}
.ex .meta{font-size:13px;color:var(--muted)}
.exlinks{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.exlinks a,.exlinks button{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;text-decoration:none;color:var(--acc);padding:2px 0}
.swapnote{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;background:var(--card2);border-radius:10px;padding:6px 10px;margin-top:10px;color:var(--muted)}
.swapnote b{color:var(--ink)}
.swapnote button{font-weight:700;color:var(--acc);font-size:12px;white-space:nowrap}
.last{font-size:13px;background:var(--card2);border-radius:10px;padding:7px 10px;margin:10px 0 6px}
.sets{margin-top:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center;margin:6px 0}
.set.time{grid-template-columns:28px 1fr 48px}
.set .n{font-weight:700;color:var(--muted);text-align:center}
.field{position:relative}
.field input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 34px 0 10px;font-size:16px;font-weight:600}
.field input::placeholder{color:var(--muted);opacity:.45;font-weight:400}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.tick{height:44px;border-radius:10px;background:var(--card2);font-size:18px;color:var(--muted)}
.set.done .tick{background:var(--ok);color:#fff}
.set.done input{background:var(--ok-soft);border-color:transparent}
.setbtns{display:flex;gap:8px;margin-top:4px}
.setbtns button{font-size:13px;color:var(--muted);padding:6px 8px}
.prog{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.prog.full{color:var(--ok)}
.act textarea,.modal textarea,.modal input,.modal select{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px;font-size:16px}
.modal .field input{padding:0 34px 0 10px}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--acc)}

/* Temporizador */
.timer{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:7;display:none;pointer-events:none}
.timer.show{display:block}
.timer .bar{pointer-events:auto;margin:0 auto 8px;max-width:612px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer .t{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;flex:1}
.timer .lbl{font-size:12px;opacity:.7;display:block;font-weight:600}
.timer button{background:rgba(127,127,127,.25);color:inherit;border-radius:10px;min-height:38px;padding:0 10px;font-weight:700;font-size:13px}
.timer.end .bar{background:var(--ok);color:#fff}
body.timing{padding-bottom:calc(140px + env(safe-area-inset-bottom))}

/* Resumen */
.hist{cursor:pointer}
.hist .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.badge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-weight:800;margin-right:8px;flex:none}
.badge.cl{background:var(--card2);color:var(--ink)}
.hist ul{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.hist li{padding:4px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
.hist li span:last-child{color:var(--muted);text-align:right}
.hist .go{color:var(--muted);font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.tot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tot-t{background:var(--card2);border-radius:10px;padding:10px 6px;text-align:center;min-width:0}
.tot-t b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.15}
.tot-t span{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.25}
.bodybox{background:#1B1F26;border-radius:14px;padding:12px 8px 10px;margin-top:12px}
.bodybox svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.heat-leg{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:#98A1AE;margin-top:8px;flex-wrap:wrap}
.heat-leg i{width:16px;height:16px;border-radius:4px;display:inline-block}
.heat-leg .gap{width:10px}
.tot-mus{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;margin-top:10px}
.tot-mus b{color:var(--ink)}
.wknav{display:flex;gap:6px}
.wknav button{width:36px;height:34px;border-radius:10px;background:var(--card2);font-weight:800;font-size:18px}
.wknav button:disabled{opacity:.35}

/* Calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-head b{font-size:16px;text-transform:capitalize}
.cal-head button,.day-head button{width:40px;height:38px;border-radius:10px;background:var(--card2);font-weight:800;font-size:18px;color:var(--ink)}
.cal-head button:disabled,.day-head button:disabled{opacity:.35}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal-cell{height:56px;border-radius:10px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:5px 0 0;min-width:0;border:2px solid transparent}
.cal-cell.blank{background:none;pointer-events:none}
.cal-cell.fut{opacity:.4}
.cal-cell .dn{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1}
.cal-cell.has .dn{color:var(--ink)}
.cal-cell.today{border-color:var(--muted)}
.cal-cell.sel{border-color:var(--acc);background:var(--acc-soft)}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;padding:0 2px}
.sd{font-style:normal;display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 3px;border-radius:5px;font-size:10.5px;font-weight:800;color:#fff;line-height:1}
.sd.A{background:#E4572E}.sd.B{background:#2F7FD8}.sd.C{background:#8A5AD0}.sd.D{background:#2F9E5F}.sd.cl{background:#7A808A}
.cal-leg{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:11px;color:var(--muted);margin-top:10px}
.cal-leg span{display:inline-flex;align-items:center;gap:4px}
.day-head{display:flex;align-items:center;gap:8px;margin:16px 0 4px;padding-top:14px;border-top:1px solid var(--line)}
.day-head .mid{flex:1;text-align:center;min-width:0}
.day-head .mid b{display:block;font-size:16px}
.day-head .mid small{color:var(--muted);font-size:12px}
.day-body{touch-action:pan-y}
.day-body .card{box-shadow:none}
.cl-line{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px}

/* Tarjeta de sesión */
.scard-img svg{width:100%;height:auto;display:block;border-radius:16px}
.scard-msg{font-size:12px;color:var(--muted);text-align:center;min-height:16px;margin-top:6px}
.exlist{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.exlist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.exlist li:first-child{border-top:0}
.exlist li span:last-child{color:var(--muted);text-align:right}
.exlist .pr{color:#c99500;font-weight:700}

/* Gráficas */
.chartbox{position:relative;margin-top:6px}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.tip b{display:block;font-size:14px}
table.data{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.data th,table.data td{text-align:left;padding:6px 4px;border-top:1px solid var(--line)}
table.data th{color:var(--muted);font-weight:600}
table.data td.r,table.data th.r{text-align:right}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px}
.seg button{min-height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.kpis{display:flex;gap:16px;margin:10px 0 2px;font-size:13px;color:var(--muted)}
.kpis b{display:block;font-size:18px;color:var(--ink)}
.strip{position:relative;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 14px 10px;margin:8px -14px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.tile{flex:none;width:84px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;text-align:center}
.tile .ph{width:76px;height:76px;border-radius:16px;background:#fff;border:2px solid var(--line);overflow:hidden;display:grid;place-items:center;font-size:26px;color:var(--muted)}
.tile .ph.none{background:var(--card2)}
.tile .ph img{width:100%;height:100%;object-fit:contain}
.tile span{font-size:11px;line-height:1.2;font-weight:600;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.nodata{opacity:.45} .tile.on.nodata{opacity:1}
.tile.on .ph{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tile.on span{color:var(--ink)}
.chead{display:flex;align-items:center;gap:6px;touch-action:pan-y;user-select:none}
.chead .arr{width:40px;height:52px;border-radius:12px;background:var(--card2);font-size:24px;font-weight:700;flex:none;color:var(--ink)}
.chead .mid{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.chead .ph{width:52px;height:52px;border-radius:12px;background:#fff;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;flex:none;font-size:22px}
.chead .ph.none{background:var(--card2)}
.chead .ph img{width:100%;height:100%;object-fit:contain}
.chead b{display:block;font-size:16px;line-height:1.2}
.chead small{color:var(--muted);font-size:12px}

/* Modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal .sheet{background:var(--card);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;overscroll-behavior:contain}
.modal .sheet h3{margin:0 0 12px}
.modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.imgview{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.imgview.one{grid-template-columns:1fr}
.imgview figure{margin:0;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.imgview img{width:100%;display:block}
.imgview figcaption{font-size:12px;color:#555;text-align:center;padding:4px}
.pk-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
.pick{display:flex;gap:10px;align-items:center;width:100%;padding:6px;border-radius:12px;text-align:left}
.pick:active{background:var(--card2)}
.pick .thumb{width:52px;height:52px}
.pick b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.pick small{color:var(--muted);font-size:12px}
.ed-ex{border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
.ed-ex .set{grid-template-columns:24px 1fr 1fr 40px}
.ed-ex .set.time{grid-template-columns:24px 1fr 40px}
.ed-ex .tick{font-size:16px;color:#d23b3b}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;display:none;max-width:90vw;text-align:center}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
footer.attr{font-size:12px;color:var(--muted);text-align:center;margin:24px 0 10px}
footer.attr a{color:inherit}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Entre<span>no</span></div>
  <div class="pill" id="nextPill">Toca <b>A</b></div>
</div></header>

<main class="wrap">
  <section id="v-train"></section>
  <section id="v-hist" class="hide"></section>
  <section id="v-chart" class="hide"></section>
  <section id="v-set" class="hide"></section>
</main>

<div class="timer" id="timer"><div class="wrap"><div class="bar">
  <div class="t"><span class="lbl" id="tLbl">Descanso</span><span id="tTime">1:30</span></div>
  <button data-t="-15">−15</button><button data-t="15">+15</button><button data-t="skip">Saltar</button>
</div></div></div>

<nav class="tabs"><div class="wrap">
  <button data-v="train" class="on"><span class="ic">🏋️</span>Entrenar</button>
  <button data-v="hist"><span class="ic">📊</span>Resumen</button>
  <button data-v="chart"><span class="ic">📈</span>Gráficas</button>
  <button data-v="set"><span class="ic">⚙️</span>Ajustes</button>
</div></nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hide">

<script>
/* ============ Ejercicios ============ */
const IMGB='https://exercise-dataset.com/images/flat/';
const IMGB2='https://raw.githubusercontent.com/RepDB/exercise-dataset/main/images/flat/';
const H1='Apunta el peso de UNA mancuerna.',HB='Apunta el peso total (barra incluida).',HU='Apunta el peso y las reps de un lado.';
/* D(nombre, imagen, grupo, músculos principales, secundarios, extras)
   grupo: para proponer cambios · x2: los kilos cuentan doble (mancuernas o un lado) · t:'time' va por segundos */
function D(n,img,g,p,s,o){return Object.assign({n,img:img==null?null:Array.isArray(img)?img:[img+'-start',img+'-peak'],g,p,s:s||[],q:n,rest:90},o||{});}
const EX={
  /* --- Rutina --- */
  bench:D('Press banca','bench-press','pecho',['chest'],['delts','triceps'],{rest:120,h:HB}),
  incdb:D('Press inclinado con mancuernas','incline-db-press','pecho',['chest'],['delts','triceps'],{rest:120,h:H1,x2:1}),
  cablefly:D('Aperturas en polea','cable-fly','pecho',['chest'],['delts'],{q:'aperturas en polea pecho'}),
  military:D('Press militar','seated-barbell-overhead-press','hombro',['delts'],['triceps','traps'],{q:'press militar con barra',rest:120,h:HB}),
  cablelat:D('Elevaciones con polea (hombro)','cable-lateral-raise','hombro',['delts'],['traps'],{q:'elevaciones laterales en polea',rest:75}),
  pushdown:D('Extensión en polea','tricep-pushdown','triceps',['triceps'],[],{q:'extension de triceps en polea'}),
  latpull:D('Jalón al pecho','lat-pulldown','jalon',['lats'],['biceps','upperback'],{rest:120}),
  row:D('Remo','seated-cable-row','remo',['upperback','lats'],['biceps','reardelts'],{q:'remo sentado en polea',rest:120}),
  pulldownm:D('Pull down en máquina','v-bar-lat-pulldown','jalon',['lats'],['biceps','upperback'],{q:'jalon en maquina agarre estrecho'}),
  facepull:D('Face pull','face-pull','hombro_post',['reardelts'],['upperback','traps'],{q:'face pull en polea',rest:75}),

/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;};
const fmt=n=>n==null?'':(Math.round(n*100)/100).toString().replace('.',',');
const fmtInt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fmtDec=n=>String(Math.round(n*10)/10).replace('.',',');
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const addDays=(iso,n)=>{const[y,m,d]=iso.split('-').map(Number);return isoOf(new Date(y,m-1,d+n));};
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'],MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function dLong(iso){const[y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);return DIAS[dt.getDay()]+' '+d+' '+MESES[m-1];}
function dShort(iso){const[,m,d]=iso.split('-');return d+'/'+m;}
function dFull(iso){const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});}
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' técnica correcta');
const nextOf=sid=>ORDER[(ORDER.indexOf(sid)+1)%ORDER.length];
const isTime=e=>!!(EX[e]&&EX[e].t==='time');
const exName=e=>EX[e]?EX[e].n:e;
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2600);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function lastFor(e,skipId){
  for(let i=S.log.length-1;i>=0;i--){const L=S.log[i];if(L.type!=='sesion'||L.id===skipId)continue;
    const x=(L.ex||[]).find(x=>x.e===e&&x.sets.length);if(x)return{date:L.date,sets:x.sets};}
  return null;
}
function setTxt(e,s){return isTime(e)?(s.sec+' s'):(fmt(s.kg)+'×'+s.reps);}
function setsLine(e,sets){

  return same?fmt(sets[0].kg)+' kg × '+sets.map(s=>s.reps).join(' · '):sets.map(s=>setTxt(e,s)).join(' · ');
}
function imgTag(file,cls){return `<img src="${IMGB+file}.webp" alt="" loading="lazy" onerror="imgErr(this,'${file}')" class="${cls||''}">`;}
function imgErr(el,file){if(!el.dataset.f){el.dataset.f=1;el.src=IMGB2+file+'.webp';}else{el.parentNode.classList.add('none');el.remove();}}
function thumbHTML(e,zoom){const x=EX[e];if(!x||!x.img)return `<div class="thumb none">🏋️</div>`;
  return zoom?x.img.map(f=>`<button class="thumb" data-zoom="${e}">${imgTag(f)}</button>`).join(''):`<div class="thumb">${imgTag(x.img[0])}</div>`;}

/* reps objetivo de un hueco (si se cambia a un ejercicio por tiempo, pasa a segundos) */
function repsFor(it,e){
  if(!it||it.r==null)return isTime(e)?'30-60 s':'8-12';
  if(typeof it.r==='object')return it.r[e]||(isTime(e)?'30-60 s':Object.values(it.r).find(v=>!/s$/.test(v))||'10-15');
  return isTime(e)?'30-60 s':it.r;
}
function slotDefault(sid,i){const it=ROUT[sid].it[i];return it.e||it.alt[0];}
function slotPlanned(sid,i){const it=ROUT[sid].it[i],k=sid+i;
  if(S.swap[k]&&EX[S.swap[k]])return S.swap[k];
  if(it.alt)return S.alt[k]&&it.alt.includes(S.alt[k])?S.alt[k]:it.alt[0];
  return it.e;}

/* ============ Músculos, kilos y récords ============ */
function statsOf(ses){const mus={};let sets=0,reps=0,kg=0,exn=0;
  ses.forEach(L=>{(L.ex||[]).forEach(x=>{const X=EX[x.e]||{p:[],s:[]};const n=x.sets.length;if(!n)return;exn++;sets+=n;
      X.p.forEach(m=>mus[m]=(mus[m]||0)+n);X.s.forEach(m=>mus[m]=(mus[m]||0)+n*0.5);
      x.sets.forEach(s=>{if(s.sec!=null||isTime(x.e))return;const r=s.reps||0;reps+=r;kg+=(s.kg||0)*(X.x2?2:1)*r;});});
    if(L.act){mus.abs=(mus.abs||0)+3;mus.obliques=(mus.obliques||0)+1.5;}});
  return{mus,sets,reps,kg:Math.round(kg),exn};}
function bestOf(e,sets){let b=null;(sets||[]).forEach(s=>{
  if(isTime(e)){if(s.sec!=null&&(!b||s.sec>b.sec))b={sec:s.sec};}
  else if(s.reps){const k=s.kg||0;if(!b||k>b.kg||(k===b.kg&&s.reps>b.reps))b={kg:k,reps:s.reps};}});return b;}
function better(e,a,b){return isTime(e)?a.sec>b.sec:(a.kg>b.kg||(a.kg===b.kg&&a.reps>b.reps));}
function recordsOf(L){const idx=S.log.indexOf(L);const out=[];
  (L.ex||[]).forEach(x=>{const now=bestOf(x.e,x.sets);if(!now)return;let old=null;
    for(let i=0;i<idx;i++){const P=S.log[i];if(P.type!=='sesion')continue;(P.ex||[]).forEach(y=>{if(y.e!==x.e)return;const b=bestOf(y.e,y.sets);if(b&&(!old||better(x.e,b,old)))old=b;});}
    if(old&&better(x.e,now,old))out.push({e:x.e,now});});
  return out;}
function bestTxt(e,b){return isTime(e)?b.sec+' s':fmt(b.kg)+' kg × '+b.reps;}
function prevSame(L){const idx=S.log.indexOf(L);for(let i=idx-1;i>=0;i--){const P=S.log[i];if(P.type==='sesion'&&P.sid===L.sid)return P;}return null;}

/* cuanto más rojo e intenso, más series */
const HEAT=['#3A414D','#5E3239','#96404B','#C9434F','#FF4D5E'];
function heatLevel(v){return !v?0:v<2?1:v<4?2:v<6.5?3:4;}
function bodySVG(side,mus,x,y,h){const s=h/1448,ox=side==='B'?-724*s:0;const Dd=BMAP_D[side];let g=`<g transform="translate(${x+ox} ${y}) scale(${s})">`;
  g+=`<path d="${side==='F'?BMAP_D.OF:BMAP_D.OB}" fill="#20252D" stroke="#4A5260" stroke-width="${2/s}"/>`;
  Object.keys(Dd).forEach(slug=>{let fill;if(BODY_SKIN[slug])fill=slug==='hair'?'#2B3039':'#4A5260';
    else{const ks=(BODY_MAP[side][slug])||[];const v=Math.max(0,...ks.map(k=>mus[k]||0));fill=HEAT[heatLevel(v)];}
    Dd[slug].forEach(d=>g+=`<path d="${d}" fill="${fill}"/>`);});
  return g+'</g>';}
function bodyPair(mus,label){return `<svg viewBox="0 0 760 720" role="img" aria-label="${esc(label||'Músculos trabajados')}">${bodySVG('F',mus,20,0,660)}${bodySVG('B',mus,410,0,660)}<text x="185" y="705" fill="#98A1AE" font-size="26" text-anchor="middle" font-family="system-ui,sans-serif">Delante</text><text x="575" y="705" fill="#98A1AE" font-size="26" text-anchor="middle" font-family="system-ui,sans-serif">Detrás</text></svg>`;}

function cardSVG(L){const st=statsOf([L]);const R=ROUT[L.sid]||{t:'Sesión'};
  const ses=S.log.filter(l=>l.type==='sesion');const n=ses.indexOf(L)+1;
  const F='font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"';
  let v=`<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E222B"/><stop offset="1" stop-color="#14161B"/></linearGradient></defs>`;
  v+=`<rect width="1080" height="__H__" fill="url(#cg)"/><rect x="0" y="0" width="1080" height="10" fill="#FF4D5E"/>`;
  v+=`<text x="64" y="92" fill="#98A1AE" font-size="28" font-weight="700" letter-spacing="3">ENTRENO${n?` · SESIÓN ${n}`:''}</text>`;
  v+=`<text x="64" y="160" fill="#EEF1F4" font-size="58" font-weight="800">${esc(R.t)}</text>`;
  v+=`<text x="64" y="208" fill="#98A1AE" font-size="32">Sesión ${esc(L.sid)} · ${esc(dFull(L.date))}</text>`;
  const bh=600,by=240;v+=bodySVG('F',st.mus,190,by,bh);v+=bodySVG('B',st.mus,570,by,bh);
  v+=`<text x="350" y="${by+bh+34}" fill="#98A1AE" font-size="24" text-anchor="middle">Delante</text><text x="730" y="${by+bh+34}" fill="#98A1AE" font-size="24" text-anchor="middle">Detrás</text>`;
  const lx=920;v+=`<text x="${lx+40}" y="300" fill="#98A1AE" font-size="20" text-anchor="middle">más</text>`;
  [4,3,2,1].forEach((l,i)=>v+=`<rect x="${lx+22}" y="${315+i*44}" width="36" height="36" rx="8" fill="${HEAT[l]}"/>`);
  v+=`<text x="${lx+40}" y="${315+4*44+22}" fill="#98A1AE" font-size="20" text-anchor="middle">series</text>`;
  const top=Object.entries(st.mus).filter(([,x])=>x>=1).sort((a,b)=>b[1]-a[1]).slice(0,6);
  let my=by+bh+86;const chips=top.map(([k,x])=>`${LBL[k]||k} ${fmtDec(x)}`);
  [chips.slice(0,3),chips.slice(3,6)].forEach((row,i)=>{if(row.length)v+=`<text x="540" y="${my+i*40}" fill="#EEF1F4" font-size="28" text-anchor="middle">${esc(row.join('   ·   '))}</text>`;});
  const ty=my+(chips.length>3?66:26);
  const tiles=[['SERIES',fmtInt(st.sets)],['REPETICIONES',fmtInt(st.reps)],['KG MOVIDOS',fmtInt(st.kg)],(L.dur?['MINUTOS',String(L.dur)]:['EJERCICIOS',String(st.exn)])];
  tiles.forEach(([l,val],i)=>{const x=64+i*244;v+=`<rect x="${x}" y="${ty}" width="220" height="132" rx="20" fill="#262C37"/><text x="${x+110}" y="${ty+74}" fill="#EEF1F4" font-size="50" font-weight="800" text-anchor="middle">${esc(val)}</text><text x="${x+110}" y="${ty+112}" fill="#98A1AE" font-size="20" font-weight="700" letter-spacing="1.5" text-anchor="middle">${l}</text>`;});
  let ly=ty+132+50;const extra=[];
  if(L.act)extra.push(`Abdomen: ${L.act.kind}${L.act.min?' '+L.act.min+' min':''}`);
  const pd=prevSame(L);if(pd){const ps=statsOf([pd]);if(ps.kg&&st.kg){const d=st.kg-ps.kg;const pc=Math.round(d/ps.kg*100);
    extra.push(`${d>=0?'+':'−'}${fmtInt(Math.abs(d))} kg (${d>=0?'+':'−'}${Math.abs(pc)} %) vs la última ${L.sid} (${dShort(pd.date)})`);}}
  extra.forEach(t=>{v+=`<text x="540" y="${ly}" fill="#98A1AE" font-size="26" text-anchor="middle">${esc(t)}</text>`;ly+=44;});
  if(extra.length)ly+=8;
  const rec=recordsOf(L);
  rec.slice(0,3).forEach((r,i)=>{v+=`<text x="540" y="${ly+i*46}" fill="#F5C542" font-size="30" font-weight="700" text-anchor="middle">★ Récord · ${esc(exName(r.e))} ${esc(bestTxt(r.e,r.now))}</text>`;});
  if(rec.length>3)v+=`<text x="540" y="${ly+3*46}" fill="#F5C542" font-size="24" text-anchor="middle">y ${rec.length-3} récord${rec.length-3>1?'s':''} más</text>`;
  const H=Math.max(1350,Math.ceil(ly+Math.min(rec.length,4)*46+20));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 ${H}" width="1080" height="${H}" ${F}>`+v.replace('__H__',H)+'</svg>';}
async function cardBlob(L){const svg=cardSVG(L);const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;});const c=document.createElement('canvas');const H=+(svg.match(/height="(\d+)"/)||[0,1350])[1];
  c.width=1080;c.height=H;c.getContext('2d').drawImage(img,0,0);return new Promise(r=>c.toBlob(r,'image/png'));}
async function shareCard(L,mode,msgEl){
  try{const blob=await cardBlob(L);const name=`entreno-${L.date}-${L.sid}.png`;const file=new File([blob],name,{type:'image/png'});
    if(mode==='share'&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Mi entreno'});return;}
    const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
    if(msgEl)msgEl.textContent=mode==='share'?'Este navegador no deja compartir directamente: la he descargado.':'Imagen descargada.';}
  catch(e){if(e&&e.name==='AbortError')return;if(msgEl)msgEl.textContent='No se pudo crear la imagen.';}}

function renderTrain(){
  const v=$('#v-train');
  $('#nextPill').innerHTML='Toca <b>'+S.next+'</b>';

  const done=S.justDone&&S.log.find(l=>l.id===S.justDone);

    v.innerHTML=`<h2>¡Sesión terminada! 💪</h2><div class="muted small" style="margin:-4px 0 10px">La próxima es la <b>${S.next}</b>.</div>

      return `<li><span>${name}</span><span class="sr">${it.s} × ${sw?repsFor(it,S.swap[k]):typeof it.r==='object'?Object.values(it.r).join(' / '):it.r}</span></li>`;}).join('')}</ul>

}

function makeSets(e,n){
  const L=lastFor(e);
  return Array.from({length:n},(_,i)=>{const p=L?L.sets[Math.min(i,L.sets.length-1)]:null;
    return isTime(e)?{sec:'',ok:false,ph:p?p.sec:''}:{kg:p?fmt(p.kg):'',reps:'',ok:false,ph:p?p.reps:''};});
}
function startSession(sid){
  const R=ROUT[sid];
  const d={sid,start:Date.now(),slots:[],act:null};
  R.it.forEach((it,i)=>{
    if(it.act){d.act={kind:'Libre',min:'15',done:false};d.slots.push({act:1});return;}
    const e=slotPlanned(sid,i);
    d.slots.push({i,e,sets:makeSets(e,it.s)});
  });
  S.draft=d;S._pick=null;S.justDone=null;save();renderTrain();window.scrollTo(0,0);

    <button class="btn ${a.done?'ok':''} grow" id="actDone">${a.done?'✓ Hecho':'Marcar hecho'}</button></div></div>`;
}
function cardHTML(idx){
  const sl=S.draft.slots[idx],it=slotIt(sl),x=EX[sl.e],L=lastFor(sl.e);
  const done=sl.sets.filter(s=>s.ok).length,tm=isTime(sl.e),k=sl.i!=null?S.draft.sid+sl.i:null;
  const def=sl.i!=null?slotDefault(S.draft.sid,sl.i):null;
  const isAlt=it.alt&&it.alt.includes(sl.e);
  const changed=sl.i!=null&&!isAlt&&sl.e!==def;
  const thumbs=x.img?x.img.map(f=>`<button class="thumb" data-zoom="${sl.e}">${imgTag(f)}</button>`).join(''):`<div class="thumb none" title="Sin foto">🏋️</div>`;
  return `<div class="top"><div class="thumbs">${thumbs}</div>
    <div class="grow"><div class="row between" style="align-items:flex-start"><h4>${x.n}</h4><span class="prog ${done===sl.sets.length?'full':''}">${done}/${sl.sets.length}</span></div>
    <div class="meta">${sl.sets.length} × ${repsFor(it,sl.e)}${x.h?' · '+x.h:''}</div>
    <div class="exlinks"><a href="${yt(x.q)}" target="_blank" rel="noopener">▶ Ver vídeo</a><button data-swap>⇄ Cambiar</button>${sl.i==null?'<button data-rmx>✕ Quitar</button>':''}</div></div></div>
    ${changed?`<div class="swapnote"><span>${S.swap[k]===sl.e?'Cambiado para siempre. ':''}Sustituye a <b>${esc(exName(def))}</b></span><button data-revert>↺ Volver</button></div>`:''}
    ${sl.i==null?`<div class="swapnote"><span>Ejercicio añadido hoy</span></div>`:''}
    ${isAlt?`<div class="chips" style="margin-top:10px">${it.alt.map(e=>`<button class="chip ${e===sl.e?'on':''}" data-alt="${e}">${exName(e)}</button>`).join('')}</div>`:''}
    <div class="last">${L?`<b>Última vez (${dShort(L.date)}):</b> ${setsLine(sl.e,L.sets)}`:(tm?'Primera vez: aguanta lo que puedas con buena postura.':'Primera vez: elige un peso con el que te sobren 2-3 repeticiones.')}</div>
    <div class="sets">${sl.sets.map((s,j)=>tm?
      `<div class="set time ${s.ok?'done':''}"><span class="n">${j+1}</span>
        <div class="field"><input inputmode="numeric" data-j="${j}" data-k="sec" value="${esc(s.sec)}" placeholder="${esc(s.ph)}"><span>seg</span></div>
        <button class="tick" data-tick="${j}">✓</button></div>`:
      `<div class="set ${s.ok?'done':''}"><span class="n">${j+1}</span>
        <div class="field"><input inputmode="decimal" data-j="${j}" data-k="kg" value="${esc(s.kg)}" placeholder="—"><span>kg</span></div>
        <div class="field"><input inputmode="numeric" data-j="${j}" data-k="reps" value="${esc(s.reps)}" placeholder="${esc(s.ph||repsFor(it,sl.e).split('-')[0])}"><span>reps</span></div>
        <button class="tick" data-tick="${j}">✓</button></div>`).join('')}</div>
    <div class="setbtns"><button data-add>＋ Serie</button>${sl.sets.length>1?'<button data-del>− Quitar serie</button>':''}</div>`;
}
function rerenderCard(idx){const el=document.querySelector(`[data-slot="${idx}"]`);if(el){el.innerHTML=cardHTML(idx);bindCard(el,idx);}}
function changeSlot(idx,e,persist){
  const sl=S.draft.slots[idx];const n=sl.sets.length;
  sl.e=e;sl.sets=makeSets(e,n);
  if(sl.i!=null){const k=S.draft.sid+sl.i,it=slotIt(sl);
    if(persist)S.swap[k]=e;
    else if(S.swap[k]&&S.swap[k]!==e)delete S.swap[k];
    if(it.alt&&it.alt.includes(e)){S.alt[k]=e;delete S.swap[k];}}
  save();rerenderCard(idx);
}
function bindCard(el,idx){
  const sl=S.draft.slots[idx];
  el.querySelectorAll('input[data-j]').forEach(inp=>inp.oninput=()=>{sl.sets[+inp.dataset.j][inp.dataset.k]=inp.value;save();});
  el.querySelectorAll('[data-tick]').forEach(b=>b.onclick=()=>{
    const j=+b.dataset.tick,s=sl.sets[j];
    if(s.ok){s.ok=false;save();rerenderCard(idx);return;}
    if(isTime(sl.e)){if(num(s.sec)==null){if(num(s.ph)!=null)s.sec=String(s.ph);else{el.querySelector(`input[data-j="${j}"]`).focus();return;}}}
    else{
      if(num(s.reps)==null){if(num(s.ph)!=null)s.reps=String(s.ph);else{el.querySelector(`input[data-j="${j}"][data-k="reps"]`).focus();return;}}
      if(num(s.kg)==null)s.kg='0';
      for(let k=j+1;k<sl.sets.length;k++)if(!sl.sets[k].ok&&sl.sets[k].kg==='')sl.sets[k].kg=s.kg;
    }
    s.ok=true;save();rerenderCard(idx);
    const allDone=sl.sets.every(z=>z.ok);
    startTimer(EX[sl.e].rest,allDone?'Siguiente ejercicio':'Descanso');
  });
  el.querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>{
    const e=b.dataset.alt;if(e===sl.e)return;
    if(sl.sets.some(s=>s.ok)&&!confirm('Ya tienes series hechas. ¿Cambiar de ejercicio y borrarlas?'))return;
    changeSlot(idx,e,false);});
  const sw=el.querySelector('[data-swap]');if(sw)sw.onclick=()=>{
    const inUse=S.draft.slots.filter((z,i)=>!z.act&&i!==idx).map(z=>z.e);
    openPicker({title:'Cambiar «'+exName(sl.e)+'»',cur:sl.e,exclude:[sl.e,...inUse],persist:sl.i!=null,
      onPick:(e,persist)=>{if(sl.sets.some(s=>s.ok)&&!confirm('Ya tienes series hechas en este ejercicio. ¿Cambiarlo y borrarlas?'))return;
        closeModal();changeSlot(idx,e,persist);toast('Cambiado a '+exName(e)+(persist?' (para siempre)':' (solo hoy)'));}});};
  const rv=el.querySelector('[data-revert]');if(rv)rv.onclick=()=>{
    if(sl.sets.some(s=>s.ok)&&!confirm('Ya tienes series hechas. ¿Volver al ejercicio original y borrarlas?'))return;
    const k=S.draft.sid+sl.i;delete S.swap[k];changeSlot(idx,slotDefault(S.draft.sid,sl.i),false);};
  const rm=el.querySelector('[data-rmx]');if(rm)rm.onclick=()=>{
    if(sl.sets.some(s=>s.ok)&&!confirm('¿Quitar este ejercicio y sus series?'))return;
    S.draft.slots.splice(idx,1);save();renderTrain();};
  const add=el.querySelector('[data-add]');if(add)add.onclick=()=>{const p=sl.sets[sl.sets.length-1];
    sl.sets.push(isTime(sl.e)?{sec:'',ok:false,ph:p.sec||p.ph}:{kg:p.kg,reps:'',ok:false,ph:p.reps||p.ph});save();rerenderCard(idx);};
  const del=el.querySelector('[data-del]');if(del)del.onclick=()=>{sl.sets.pop();save();rerenderCard(idx);};
  el.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>zoom(b.dataset.zoom));
}
let elT;
function bindSession(){
  document.querySelectorAll('[data-slot]').forEach(el=>bindCard(el,+el.dataset.slot));
  const a=S.draft.act;
  if(a){
    document.querySelectorAll('[data-actk]').forEach(b=>b.onclick=()=>{a.kind=b.dataset.actk;save();renderTrain();});
    $('#actMin').oninput=e=>{a.min=e.target.value;save();};
    $('#actDone').onclick=()=>{a.done=!a.done;save();renderTrain();};
  }
  $('#discardBtn').onclick=()=>{if(confirm('¿Descartar esta sesión? No se guardará nada.')){S.draft=null;save();stopTimer();renderTrain();}};
  $('#addExBtn').onclick=()=>{const inUse=S.draft.slots.filter(z=>!z.act).map(z=>z.e);
    openPicker({title:'Añadir ejercicio',exclude:inUse,onPick:e=>{closeModal();S.draft.slots.push({i:null,e,sets:makeSets(e,3)});save();renderTrain();
      setTimeout(()=>{const el=document.querySelector(`[data-slot="${S.draft.slots.length-1}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},50);}});};
  $('#finishBtn').onclick=finishSession;
  const tick=()=>{const el=$('#elapsed');if(!el||!S.draft){clearInterval(elT);return;}const m=Math.floor((Date.now()-S.draft.start)/60000);el.textContent=m+' min';};
  clearInterval(elT);tick();elT=setInterval(tick,20000);
}
function finishSession(){
  const d=S.draft,ex=[];
  d.slots.forEach(sl=>{if(sl.act)return;
    const sets=sl.sets.map(s=>isTime(sl.e)?{sec:num(s.sec)}:{kg:num(s.kg)??0,reps:num(s.reps)})
      .filter(s=>isTime(sl.e)?s.sec!=null:s.reps!=null);
    if(sets.length){const prev=ex.find(z=>z.e===sl.e);if(prev)prev.sets.push(...sets);else ex.push({e:sl.e,sets});}});
  const act=d.act&&d.act.done?{kind:d.act.kind,min:num(d.act.min)||0}:null;
  if(!ex.length&&!act){if(!confirm('No has apuntado ninguna serie. ¿Terminar sin guardar?'))return;S.draft=null;save();stopTimer();renderTrain();return;}
  const pending=d.slots.filter(sl=>!sl.act&&sl.sets.some(s=>!s.ok)).length;
  if(pending&&!confirm(`Quedan ${pending} ejercicio(s) sin completar. ¿Terminar igual?`))return;
  const id=uid();
  S.log.push({id,type:'sesion',date:todayISO(),sid:d.sid,dur:Math.round((Date.now()-d.start)/60000),ex,act});sortLog();
  S.next=nextOf(d.sid);S.draft=null;S.justDone=id;save();stopTimer();renderTrain();window.scrollTo(0,0);
}

/* ============ Selector de ejercicios (cambiar / añadir) ============ */
function famOf(g){return FAM.find(f=>f.g.includes(g));}
function openPicker(o){
  let persist=false,showAll=!o.cur;
  const draw=()=>{
    const ex=new Set(o.exclude||[]);
    const row=e=>{const L=lastFor(e);return `<button class="pick" data-pk="${e}">${thumbHTML(e)}<div class="grow"><b>${esc(exName(e))}</b><small>${L?'Última vez: '+setsLine(e,L.sets):'Sin registros todavía'}</small></div></button>`;};
    const keys=Object.keys(EX).filter(e=>!ex.has(e));
    let h=`<h3>${esc(o.title)}</h3>`;
    if(o.persist)h+=`<div class="seg" style="width:100%"><button class="grow ${persist?'':'on'}" data-ps="0">Solo hoy</button><button class="grow ${persist?'on':''}" data-ps="1">Siempre en esta sesión</button></div>
      <div class="muted small" style="margin-top:6px">${persist?'Se quedará cambiado las próximas veces (lo puedes deshacer con «Volver»).':'La próxima vez volverá el ejercicio original.'}</div>`;
    if(o.cur){const g=EX[o.cur].g,f=famOf(g);
      const same=keys.filter(e=>EX[e].g===g),fam=keys.filter(e=>EX[e].g!==g&&f&&f.g.includes(EX[e].g));
      h+=`<div class="pk-h">Parecidos</div>${same.length?same.map(row).join(''):'<div class="muted small">No hay más de este tipo.</div>'}`;
      if(fam.length)h+=`<div class="pk-h">Más de ${f.n.toLowerCase()}</div>${fam.map(row).join('')}`;
      if(!showAll)h+=`<button class="btn ghost block" style="margin-top:12px" data-all>Ver todos los ejercicios</button>`;}
    if(showAll){FAM.forEach(f=>{const es=keys.filter(e=>f.g.includes(EX[e].g)&&!(o.cur&&famOf(EX[o.cur].g)===f));
      if(es.length)h+=`<div class="pk-h">${f.n}</div>${es.map(row).join('')}`;});}
    h+=`<button class="btn block" style="margin-top:14px" data-pkclose>Cancelar</button>`;
    openModal(h);
    $('#sheet').querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{persist=b.dataset.ps==='1';const sc=$('#sheet').scrollTop;draw();$('#sheet').scrollTop=sc;});
    const all=$('#sheet').querySelector('[data-all]');if(all)all.onclick=()=>{showAll=true;const sc=$('#sheet').scrollTop;draw();$('#sheet').scrollTop=sc;};
    $('#sheet').querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>o.onPick(b.dataset.pk,persist));
    $('#sheet').querySelector('[data-pkclose]').onclick=()=>{if(o.onCancel)o.onCancel();else closeModal();};
  };
  draw();$('#sheet').scrollTop=0;
}

      ${ED.act?`<div class="chips" style="margin-top:8px">${['Clase dirigida','Libre'].map(k=>`<button class="chip ${ED.act.kind===k?'on':''}" data-eactk="${k}">${k}</button>`).join('')}</div>
      <div class="field" style="max-width:150px;margin-top:8px"><input inputmode="numeric" id="eActMin" value="${esc(ED.act.min)}"><span>min</span></div>`:''}</div>`:''}

  sh.querySelectorAll('[data-eswap]').forEach(b=>b.onclick=()=>{const i=+b.dataset.eswap,x=ED.ex[i];
    openPicker({title:'Cambiar «'+exName(x.e)+'»',cur:x.e,exclude:ED.ex.map(z=>z.e),onCancel:renderEdit,
      onPick:e=>{const wasT=isTime(x.e);x.e=e;if(wasT!==isTime(e))x.sets=x.sets.map(()=>isTime(e)?{sec:''}:{kg:'',reps:''});renderEdit();}});});
  $('#eAddEx').onclick=()=>openPicker({title:'Añadir ejercicio',exclude:ED.ex.map(z=>z.e),onCancel:renderEdit,

  const ad=$('#eActAdd');if(ad)ad.onclick=()=>{ED.act={kind:'Libre',min:15};renderEdit();};

function saveEdit(){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ED.date||'')){alert('Pon una fecha válida.');return;}

  const i=S.log.findIndex(l=>l.id===ED.id);if(i<0){closeModal();return;}
  S.log[i]=Object.assign({},S.log[i],{date:ED.date,dur:num(ED.dur)||0,ex,act});sortLog();save();closeModal();toast('Sesión actualizada');

/* ============ Temporizador de descanso ============ */
let tEnd=0,tInt=null,tHide=null;
function startTimer(sec,label){
  clearTimeout(tHide);tEnd=Date.now()+sec*1000;$('#tLbl').textContent=label||'Descanso';
  const t=$('#timer');t.classList.add('show');document.body.classList.add('timing');t.classList.remove('end');clearInterval(tInt);tInt=setInterval(tickTimer,250);tickTimer();
}
function tickTimer(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  $('#tTime').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  if(left<=0){clearInterval(tInt);const t=$('#timer');t.classList.add('end');$('#tLbl').textContent='¡Siguiente serie!';beep();
    if(navigator.vibrate)navigator.vibrate([250,120,250]);tHide=setTimeout(stopTimer,4000);}
}
function stopTimer(){clearInterval(tInt);clearTimeout(tHide);$('#timer').classList.remove('show','end');document.body.classList.remove('timing');}
document.querySelectorAll('#timer [data-t]').forEach(b=>b.onclick=()=>{const v=b.dataset.t;if(v==='skip')return stopTimer();
  tEnd=Math.max(Date.now()+1000,tEnd+(+v)*1000);if(!tInt||$('#timer').classList.contains('end')){$('#timer').classList.remove('end');clearTimeout(tHide);clearInterval(tInt);tInt=setInterval(tickTimer,250);}tickTimer();});
let AC;function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,0.25].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.001,AC.currentTime+d);g.gain.exponentialRampToValueAtTime(.3,AC.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d+.18);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.2);});}catch(e){}}

function dayPanelHTML(){

let chartSel=null,chartMetric='max',chartGroup=null;
function seriesFor(e){
  return S.log.filter(l=>l.type==='sesion').map(l=>{const x=(l.ex||[]).find(x=>x.e===e);if(!x||!x.sets.length)return null;
    if(isTime(e)){const m=Math.max(...x.sets.map(s=>s.sec));return{date:l.date,max:m,vol:x.sets.reduce((a,s)=>a+s.sec,0),sets:x.sets};}
    const m=Math.max(...x.sets.map(s=>s.kg));return{date:l.date,max:m,vol:x.sets.reduce((a,s)=>a+s.kg*s.reps,0),sets:x.sets};}).filter(Boolean);
}
function groupEx(k){const es=[];const add=e=>{if(e&&EX[e]&&!es.includes(e))es.push(e);};
  ROUT[k].it.forEach((it,i)=>{if(it.act)return;add(S.swap[k+i]);(it.alt||[it.e]).forEach(add);});
  S.log.forEach(l=>{if(l.type==='sesion'&&l.sid===k)(l.ex||[]).forEach(x=>add(x.e));});return es;}
function groupOf(e){return ORDER.find(k=>groupEx(k).includes(e))||'A';}

function niceTicks(min,max,n){
  if(min===max){min=min-1;max=max+1;}

}

  const css=getComputedStyle(document.documentElement),acc=css.getPropertyValue('--acc').trim(),line=css.getPropertyValue('--line').trim(),mut=css.getPropertyValue('--muted').trim(),card=css.getPropertyValue('--card').trim();

  pts.forEach((p,i)=>{if(i%lblEvery===0||i===pts.length-1)s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${mut}">${dShort(p.x)}</text>`;});
  if(pts.length>1)s+=`<polyline fill="none" stroke="${acc}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p,i)=>X(i)+','+Y(p.y)).join(' ')}"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(p.y)}" r="4.5" fill="${acc}" stroke="${card}" stroke-width="2"/>`;});
  s+=`<line id="cross" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="${mut}" stroke-dasharray="3 3" visibility="hidden"/>`;

    const p=pts[bi];cross.setAttribute('x1',X(bi));cross.setAttribute('x2',X(bi));cross.setAttribute('visibility','visible');
    tip.innerHTML=`<b>${fmt(p.y)} ${unit}</b>${dLong(p.x)}`;tip.style.display='block';
    tip.style.left=Math.min(Math.max(X(bi)*r.width/W,50),r.width-50)+'px';tip.style.top=(Y(p.y)*r.height/H)+'px';};
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);
  svg.addEventListener('pointerleave',()=>{tip.style.display='none';cross.setAttribute('visibility','hidden');});
}

/* ============ Vista: Ajustes ============ */
function renderSet(){
  const v=$('#v-set');
  const sw=Object.entries(S.swap).filter(([k,e])=>EX[e]&&ROUT[k[0]]&&ROUT[k[0]].it[+k.slice(1)]);
  v.innerHTML=`<h2>Ajustes</h2>
  <div class="card"><b>Siguiente sesión</b><div class="muted small" style="margin:2px 0 10px">Las sesiones van en orden A → B → C → D. Si te saltas un día, sigues por donde lo dejaste. Cámbiala aquí solo si se ha descolocado.</div>
    <div class="chips">${ORDER.map(k=>`<button class="chip ${k===S.next?'on':''}" data-nx="${k}">${k}</button>`).join('')}</div></div>
  <div class="card"><b>Ejercicios cambiados para siempre</b>
    ${sw.length?`<ul class="exlist">${sw.map(([k,e])=>`<li><span>Sesión ${k[0]}: <b>${esc(exName(e))}</b><br><small class="muted">en lugar de ${esc(exName(slotDefault(k[0],+k.slice(1))))}</small></span><button class="btn sm" data-unsw="${k}">↺ Volver</button></li>`).join('')}</ul>`
      :'<div class="muted small" style="margin-top:4px">Ninguno. Durante la sesión, «⇄ Cambiar» → «Siempre en esta sesión».</div>'}</div>
  <div class="card"><b>Copia de seguridad</b><div class="muted small" style="margin:2px 0 10px">Tus datos se guardan solo en este móvil. Si borras los datos del navegador o cambias de teléfono, se pierden. Exporta una copia de vez en cuando (por ejemplo, cada semana) y guárdala en Drive o envíatela.</div>
    <div class="muted small" style="margin-bottom:10px">${S.log.length} registros guardados${S.lastExport?' · Última copia: '+dLong(S.lastExport):' · Aún no has hecho ninguna copia'}</div>
    <div class="row"><button class="btn pri grow" id="expBtn">⬇ Exportar copia</button><button class="btn grow" id="impBtn">⬆ Importar copia</button></div></div>
  <div class="card"><b>Borrar todo</b><div class="muted small" style="margin:2px 0 10px">Elimina todas las sesiones de este móvil. Haz antes una copia.</div>
    <button class="btn ghost danger block" id="wipeBtn">Borrar todos los datos</button></div>
  <footer class="attr">Imágenes de ejercicios: Exercise data by <a href="https://repdb.co" target="_blank" rel="noopener">RepDB (repdb.co)</a><br>Mapa muscular: react-body-highlighter (MIT)<br>Los vídeos abren una búsqueda en YouTube del ejercicio.</footer>`;
  v.querySelectorAll('[data-nx]').forEach(b=>b.onclick=()=>{S.next=b.dataset.nx;S._pick=null;save();renderSet();$('#nextPill').innerHTML='Toca <b>'+S.next+'</b>';toast('Siguiente sesión: '+S.next);});
  v.querySelectorAll('[data-unsw]').forEach(b=>b.onclick=()=>{delete S.swap[b.dataset.unsw];save();renderSet();toast('Vuelve el ejercicio original');});
  $('#expBtn').onclick=()=>{
    const data=JSON.stringify({app:'entreno',v:1,exported:new Date().toISOString(),log:S.log,next:S.next,alt:S.alt,swap:S.swap},null,1);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='entreno-copia-'+todayISO()+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
    S.lastExport=todayISO();save();renderSet();toast('Copia descargada');};
  $('#impBtn').onclick=()=>$('#fileIn').click();
  $('#wipeBtn').onclick=()=>{if(confirm('¿Seguro? Se borrarán todas tus sesiones de este móvil.')&&confirm('Última confirmación: ¿borrar todo?')){S={v:1,log:[],next:'A',draft:null,alt:{},swap:{},justDone:null};save();stopTimer();toast('Datos borrados');render();}};
}
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='entreno'||!Array.isArray(d.log))throw 0;
    if(!confirm(`La copia tiene ${d.log.length} registros. Sustituirá a los ${S.log.length} actuales. ¿Continuar?`))return;
    S.log=d.log;sortLog();S.next=ORDER.includes(d.next)?d.next:'A';S.alt=d.alt||{};S.swap=d.swap||{};S.justDone=null;save();toast('Copia importada');render();}
    catch(err){alert('Ese archivo no es una copia válida de esta app.');}e.target.value='';};
  r.readAsText(f);};

/* ============ Navegación ============ */
let view='train';
function render(){
  ['train','hist','chart','set'].forEach(k=>$('#v-'+k).classList.toggle('hide',k!==view));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#nextPill').innerHTML='Toca <b>'+S.next+'</b>';
  ({train:renderTrain,hist:renderHist,chart:renderChart,set:renderSet})[view]();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();window.scrollTo(0,0);});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(view==='chart')renderChart();},200);});
sortLog();render();
</script>
</body>
